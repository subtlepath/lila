dialogue:
  title: En el tianguis
  title_en: At the street market
  lines:
    - speaker: Lupe
      es: "¡Buenos días, marchanta! ¿Qué le damos?"
      en: "Good morning, dear! What can I get you?"
    - speaker: Ana
      es: "Buenos días, doña Lupe. ¿A cómo el mango?"
      en: "Good morning, doña Lupe. How much are the mangoes?"
    - speaker: Lupe
      es: "A cuarenta pesos el kilo, güera."
      en: "Forty pesos a kilo, honey."
      reviewer_notes: "Vendor calling the customer marchanta and güera: are the translations dear and honey right in tone?"
    - speaker: Ana
      es: "¿Estos o esos?"
      en: "These or those?"
    - speaker: Lupe
      es: "Esos, los amarillos. ¡Están muy dulces!"
      en: "Those, the yellow ones. They're really sweet!"
    - speaker: Ana
      es: "Un kilo de esos y un kilo de naranjas. ¿Y qué es aquella fruta roja?"
      en: "A kilo of those and a kilo of oranges. And what's that red fruit over there?"
    - speaker: Lupe
      es: "Es tuna, la fruta del nopal. ¿Algo más?"
      en: "It's tuna, the fruit of the nopal cactus. Anything else?"
    - speaker: Ana
      es: "Medio kilo de nopales, y es todo."
      en: "Half a kilo of nopales, and that's all."
