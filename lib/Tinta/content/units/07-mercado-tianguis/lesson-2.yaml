number: 2
title: ¿Me la puedo probar?
title_en: Can I try it on?
level: A2
reviewer_notes:
  - "The culture note says Mexican shoe sizes are in centimeters, with a US men's 9 about a 27. Correct?"
  - "Culture note: are ¿Le ayudo en algo? and ¿Qué busca? what clerks say, and Nada más estoy viendo what a customer answers?"
  - "Usage note: does Mexico usually say un pantalón in the singular? Is chaqueta for a jacket really to be avoided?"
new: [ropa, camisa, playera, pantalón, chamarra, tenis, azul, negro, blanco, gris, probarse, lo]
conjugate: ["probarse:pres"]
notes:
  - kind: grammar
    title: Lo, la, los, las
    text: |
      To avoid repeating a thing, replace it with _lo, la, los_ or _las_. The pronoun agrees with the thing it stands for:

      - _¿El pantalón? *Lo* compro._ — The pants? I'll buy them.
      - _¿La chamarra? *La* compro._ — The jacket? I'll buy it.
      - _¿Los tenis? Me *los* llevo._ — The sneakers? I'll take them.
      - _¿Las playeras? *Las* quiero en azul._ — The T-shirts? I want them in blue.

      The pronoun goes right before the conjugated verb, or on the end of an infinitive, never in between:

      - _¿Me la puedo probar?_ or _¿Puedo probármela?_ — Can I try it on?

      With _me_, _te_ or _se_, the object pronoun comes second: _me lo llevo_, _se lo dejo_.
  - kind: usage
    title: Mexican clothes words
    text: |
      - _playera_ — T-shirt
      - _chamarra_ — jacket. Never ~chaqueta~: in Mexico it is vulgar slang.
      - _tenis_ — sneakers, always plural: _unos tenis_, _los tenis_
      - _pantalón_ — pants, usually singular: _un pantalón negro_

      To say how something fits, use _quedar_: _¿Cómo me queda?_ The answers: _Me queda bien_ (it fits), _me queda grande_ (it's too big), _me queda chico_ (it's too small).
  - kind: culture
    title: Me lo llevo
    text: |
      _Me lo llevo_ (I'll take it) is how you close a sale, in a shop or at a stall. Match the thing: _me la llevo_, _me los llevo_.

      Shop clerks greet you with _¿Le ayudo en algo?_ or _¿Qué busca?_ If you are just looking, say _Nada más estoy viendo, gracias._ Market vendors call out _¿Qué le damos?_ and _¡Pásele, pásele!_

      Shoe sizes in Mexico are in centimeters: a US men's 9 is about a _veintisiete_.
