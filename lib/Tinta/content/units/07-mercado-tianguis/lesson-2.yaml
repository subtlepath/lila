dialogue:
  title: En la tienda de ropa
  title_en: At the clothes store
  lines:
    - speaker: Señorita
      es: "Buenas tardes. ¿Le ayudo en algo?"
      en: "Good afternoon. Can I help you with anything?"
    - speaker: Tom
      es: "Sí, gracias. Busco una chamarra."
      en: "Yes, thanks. I'm looking for a jacket."
    - speaker: Señorita
      es: "¿De qué talla? Tenemos esta azul y esta negra."
      en: "What size? We have this blue one and this black one."
    - speaker: Tom
      es: "Mediana. Me gusta la azul. ¿Me la puedo probar?"
      en: "Medium. I like the blue one. Can I try it on?"
    - speaker: Señorita
      es: "Sí, pásele. ¿Cómo le queda?"
      en: "Sure, go ahead. How does it fit?"
    - speaker: Tom
      es: "Me queda grande. La negra sí me queda bien. Me la llevo."
      en: "It's too big. The black one fits, though. I'll take it."
    - speaker: Señorita
      es: "Muy bien. ¿Algo más? Tenemos tenis muy bonitos."
      en: "Great. Anything else? We have some really nice sneakers."
    - speaker: Tom
      es: "¿Estos blancos? Del veintisiete, por favor. ¡Me los llevo!"
      en: "These white ones? A size twenty-seven, please. I'll take them!"
      reviewer_notes: "Del veintisiete for a shoe size: natural? The clerk asks talla for the jacket; for shoes, is it número?"
