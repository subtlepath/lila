number: 3
title: ¿Me lo deja más barato?
title_en: Can you do it cheaper?
level: A2
reviewer_notes:
  - "Check the money note: bills of 20 to 1000, coins of 1, 2, 5, 10, 20 pesos and 50 centavos. Do peseros and taco stands take cash only?"
  - "Bargaining note: only at markets, tianguis and craft stalls, never in shops. Is ¿Cuánto es lo menos? the usual way to ask for the best price?"
new: [dinero, efectivo, billete, cambio, doscientos, quinientos, mil, vender, barato, menos, mejor, dejar]
conjugate: ["vender:pres", "dejar:pres.3s"]
notes:
  - kind: grammar
    title: Comparing
    text: |
      Three patterns compare two things:

      - _más ... que_ — more ... than: _Este es más barato que ese._
      - _menos ... que_ — less ... than: _Esta cuesta menos que aquella._
      - _tan ... como_ — as ... as: _Es tan caro como el otro._

      _Bueno_ and _malo_ have their own forms: _mejor_ (better) and _peor_ (worse). Say _Este es mejor_, not _más bueno_, when you mean better quality.

      Add _el_ or _la_ for the most: _el más barato_ (the cheapest), _la mejor_ (the best).
  - kind: usage
    title: Bargaining politely
    text: |
      Bargain only at markets, tianguis and craft stalls, never in shops or supermarkets, and keep it friendly:

      - _¿Me lo deja en cien?_ — Will you let me have it for a hundred?
      - _¿Cuánto es lo menos?_ — What's your best price?
      - _Se lo dejo en ciento veinte._ — I'll let you have it for a hundred and twenty.
      - _Va._ or _Está bien._ — Deal.

      A small discount is normal. Haggling hard over a few pesos is not: for the vendor, those pesos matter more than for you.
  - kind: culture
    title: Mexican money
    text: |
      Pesos come in bills (_billetes_) of 20, 50, 100, 200, 500 and 1000, and coins (_monedas_) of 1, 2, 5, 10 and 20 pesos, plus 50 centavos. Prices use the same sign as the dollar: $50 is fifty pesos.

      Small shops, taxis and stalls often have no change, so a 500 bill can be a problem: _¿No tiene más chico?_ Carry small bills and coins. Tianguis, taco stands and _peseros_ take _efectivo_ (cash) only.
