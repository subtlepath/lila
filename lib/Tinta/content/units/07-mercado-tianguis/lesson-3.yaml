dialogue:
  title: ¿Me lo deja en cien?
  title_en: Will you take a hundred?
  lines:
    - speaker: Ana
      es: "Buenos días. ¿Cuánto cuesta esta bolsa?"
      en: "Good morning. How much is this bag?"
    - speaker: Señor
      es: "Doscientos pesos, señorita."
      en: "Two hundred pesos, miss."
    - speaker: Ana
      es: "Es más bonita que aquella, pero más cara. ¿Me la deja en ciento cincuenta?"
      en: "It's prettier than that one, but more expensive. Will you let me have it for a hundred and fifty?"
    - speaker: Señor
      es: "Ay, no, señorita. Se la dejo en ciento setenta."
      en: "Oh, no, miss. I'll let you have it for a hundred and seventy."
    - speaker: Ana
      es: "Va. Aquí tiene quinientos."
      en: "Deal. Here's five hundred."
    - speaker: Señor
      es: "¿No tiene más chico? No tengo [cambio|cambio]."
      en: "Don't you have anything smaller? I don't have change."
    - speaker: Ana
      es: "Sí, tengo uno de cien, uno de cincuenta y uno de veinte."
      en: "Yes, I have a hundred, a fifty and a twenty."
    - speaker: Señor
      es: "Muy bien. Gracias, señorita. ¡Que le vaya bien!"
      en: "Great. Thank you, miss. Have a good day!"
      reviewer_notes: "¡Que le vaya bien! as a vendor's goodbye, and Va for deal: right register?"
