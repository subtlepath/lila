    en: "My parents live in Guadalajara."
  - es: "Mi {departamento} es chico, pero tiene dos baños."
    en: "My apartment is small, but it has two bathrooms."
  - es: "Ana vive en un {departamento} en la calle Xola."
    en: "Ana lives in an apartment on Xola Street."
  - es: "El {edificio} tiene cinco pisos."
    en: "The building has five floors."
    allow: [piso]
