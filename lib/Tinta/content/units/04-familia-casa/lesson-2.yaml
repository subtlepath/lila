dialogue:
  title: Bienvenido
  title_en: Welcome
  reviewer_notes: "Ana says Pásale (tú) to Tom, and Mi casa es su casa (usted) to doña Laura, who says tú to Ana. The note says friends say mi casa es tu casa. Is the address right throughout?"
  lines:
    - speaker: Ana
      es: "¡Bienvenido, Tom! Pásale. Aquí está la sala."
      en: "Welcome, Tom! Come on in. This is the living room."
    - speaker: Tom
      es: "Gracias. ¿Y cuántas recámaras tiene el departamento?"
      en: "Thanks. And how many bedrooms does the apartment have?"
    - speaker: Ana
      es: "Dos, y un baño. Vivo en el tercer piso, y arriba está la azotea."
      en: "Two, and one bathroom. I live on the third floor, and the roof terrace is right above."
      allow: [piso]
    - speaker: Laura
      es: "Buenas tardes, Ana. ¿Quién es tu amigo?"
      en: "Good afternoon, Ana. Who's your friend?"
    - speaker: Ana
      es: "Buenas tardes, doña Laura. Él es Tom."
      en: "Good afternoon, doña Laura. This is Tom."
    - speaker: Tom
      es: "Mucho gusto, señora. ¿Usted también vive aquí?"
      en: "Nice to meet you, ma'am. Do you live here too?"
    - speaker: Laura
      es: "Sí, en el segundo piso. ¡Bienvenido a nuestro edificio!"
      en: "Yes, on the second floor. Welcome to our building!"
      allow: [piso]
    - speaker: Ana
      es: "Pase, doña Laura. Mi casa es su casa."
      en: "Come in, doña Laura. My home is your home."
