number: 2
title: Mi casa es su casa
title_en: My home is your home
level: A1
new: [vivir, departamento, edificio, piso, puerta, sala, cuarto, recámara, baño, azotea, vecino, nuestro]
conjugate: ["vivir:pres"]
reviewer_notes:
  - "Rooms note: the primer piso is usually one floor up from the planta baja. Translations keep the Spanish number ('tercer piso' = 'third floor'). Is Mexican usage mixed enough to keep that, or should the English shift by one floor?"
  - "Culture note: azoteas with the tinaco, the gas tank, laundry lines and a dog keeping watch. Accurate?"
notes:
  - kind: grammar
    title: Whose is it?
    text: |
      The possessives go before the noun and agree with the *thing owned*, not with the owner:

      - _mi casa_, _mis llaves_ — my
      - _tu cuarto_, _tus primos_ — your (a friend)
      - _su departamento_, _sus vecinos_ — his, her, its, their, your (usted or ustedes)
      - _nuestro edificio_, _nuestra sala_, _nuestros hijos_, _nuestras sillas_ — our

      _Su_ has many meanings. When it is not clear, say _de_ + the person: _la casa de Ana_ (Ana's house), _el cuarto de ustedes_ (your room). Spanish has no _'s_: _el carro de mi papá_ is my dad's car.
  - kind: usage
    title: Rooms and floors
    allow: [piso]
    text: |
      - _la recámara_ — the bedroom. It is the Mexican word; _el cuarto_ (the room) also works for a bedroom.
      - _la sala_ — the living room
      - _el baño_ — the bathroom, and the restroom in a restaurant
      - _el piso_ — a floor or story of a building: _Vivo en el tercer piso._

      A _piso_ is never an apartment in Mexico: that is a _departamento_ (~piso~ in that sense is Spanish from Spain). The ground floor is the _planta baja_, and the _primer piso_ is usually one floor up.
  - kind: culture
    title: Mi casa es su casa
    text: |
      _Mi casa es su casa_ (my home is your home) is how Mexicans welcome a guest, and they mean it: expect to be offered something to eat or drink. Among friends it becomes _mi casa es tu casa_.

      Most people in the big cities live in a _departamento_. Mexican roofs are flat, and the _azotea_ holds the water tank (_tinaco_), the gas tank and the laundry lines. On many azoteas there is also a dog keeping watch.
