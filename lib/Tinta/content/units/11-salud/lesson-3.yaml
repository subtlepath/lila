number: 3
title: ¡Auxilio!
title_en: Help!
level: A2
reviewer_notes:
  - "Culture note: public hospitals (IMSS, ISSSTE) and private hospitals all take emergencies. Accurate?"
  - "Forms of address: usted throughout between Tom, the injured señora and the nurse. Natural in an emergency?"
  - "Culture note: 911 works nationwide; the Cruz Roja runs largely on donations with a yearly national collection. Accurate?"
new: [auxilio, emergencia, accidente, herido, sangre, ambulancia, hospital, enfermero, cuidado, moverse, quemarse, cortarse]
conjugate: ["llamar:imp", "venir:imp", "moverse:impneg"]
notes:
  - kind: grammar
    title: Commands with usted and ustedes
    text: |
      In an emergency people give orders with _usted_, even to strangers. The command comes from the yo form: drop the _-o_ and switch the vowel.

      - _llamo_ gives _llame_ (call), _vengo_ gives _venga_ (come), _tengo_ gives _tenga_ (have)
      - irregular: _vaya_ (go), _sea_ (be), _esté_ (be), _dé_ (give)
      - for _ustedes_, add _-n_: _llamen_, _vengan_

      Pronouns attach to a positive command and go before a negative one:

      - _Siéntese._ — Sit down. _Cálmese._ — Calm down.
      - _No se mueva._ — Don't move. _No se muevan._ — Don't move (to a group).

      With _tú_ the negative is different: _No te muevas._
  - kind: usage
    title: Emergency phrases
    text: |
      Phrases to know before you need them:

      - _¡Auxilio!_ — Help! (a cry for help in danger)
      - _¡Cuidado!_ — Careful! Look out!
      - _Llame al nueve uno uno._ — Call 911.
      - _Necesito una ambulancia._ — I need an ambulance.
      - _¿Dónde está el hospital?_ — Where is the hospital?
      - _Me corté._ — I cut myself. _Me quemé._ — I burned myself.
      - _Hay un herido._ — Someone is hurt.
  - kind: culture
    title: 911 and the Cruz Roja
    text: |
      In an emergency anywhere in Mexico, call _911_ (say _nueve uno uno_). It covers police, fire and ambulances.

      Many ambulances belong to the _Cruz Roja Mexicana_ (the Mexican Red Cross), which runs largely on donations; every year it holds a national collection.

      Public hospitals, such as those of the _IMSS_ and the _ISSSTE_, and private hospitals all take emergencies.
