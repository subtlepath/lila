dialogue:
  title: Un accidente
  title_en: An accident
  lines:
    - speaker: Tom
      es: "¡Señora! ¿Está bien? No se mueva."
      en: "Ma'am! Are you all right? Don't move."
    - speaker: Señora
      es: "Ay, me caí de la bicicleta. Me duele el brazo."
      en: "Oh, I fell off my bike. My arm hurts."
    - speaker: Tom
      es: "Tiene sangre en el brazo. ¡Auxilio! ¿Alguien me ayuda?"
      en: "There's blood on your arm. Help! Can somebody help me?"
    - speaker: Enfermera
      es: "Soy enfermera. Usted, llame al nueve uno uno y pida una ambulancia."
      en: "I'm a nurse. You, call 911 and ask for an ambulance."
    - speaker: Tom
      es: "¿[Bueno|bueno#hello]? Hubo un accidente en la esquina de Insurgentes y Reforma. Hay una señora herida."
      en: "Hello? There's been an accident on the corner of Insurgentes and Reforma. A woman is hurt."
    - speaker: Enfermera
      es: "Tranquila, señora. La ambulancia ya viene."
      en: "Stay calm, ma'am. The ambulance is on its way."
    - speaker: Señora
      es: "Gracias. Ustedes son muy amables."
      en: "Thank you. You're both very kind."
    - speaker: Enfermera
      es: "Ya llegó la ambulancia. Tenga cuidado, señora: la van a llevar al hospital."
      en: "The ambulance is here. Careful, ma'am: they're going to take you to the hospital."
