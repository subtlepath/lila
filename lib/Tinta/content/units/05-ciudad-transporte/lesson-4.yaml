    en: "My dad drives a taxi."
dialogue:
  title: ¿Dónde me bajo?
  title_en: Where do I get off?
  reviewer_notes: "'¡Bajan!' to get off, and the driver's 'Súbanse' to two passengers: natural pesero talk?"
  lines:
    - speaker: Sofía
      es: "¡Ay, el metro va muy lleno! ¿Nos bajamos aquí y agarramos un pesero?"
      en: "Ugh, the metro is packed! Shall we get off here and catch a pesero?"
    - speaker: Tom
      es: "Sí, vamos."
      en: "Sure, let's go."
    - speaker: Sofía
      es: "Buenas tardes, don Beto. ¿Pasa por la Condesa?"
      en: "Good afternoon, don Beto. Do you go through the Condesa?"
    - speaker: Beto
      es: "Sí, señorita. Súbanse."
      en: "Yes, miss. Hop on."
    - speaker: Tom
      es: "¿Y dónde me bajo para el parque?"
      en: "And where do I get off for the park?"
    - speaker: Beto
      es: "En la segunda parada, joven."
      en: "At the second stop, young man."
    - speaker: Sofía
      es: "¡Bajan!"
      en: "Getting off!"
    - speaker: Tom
      es: "En Chicago manejo, pero aquí no. ¡Qué rápido maneja don Beto!"
      en: "In Chicago I drive, but not here. Don Beto drives so fast!"
