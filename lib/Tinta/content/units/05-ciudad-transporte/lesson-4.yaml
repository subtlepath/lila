    en: "The bus is really packed."
  - es: "La estación está {llena}."
    en: "The station is packed."
  - es: "{Agarro} el metro en el centro."
    en: "I catch the metro downtown."
  - es: "¿{Agarramos} un taxi?"
    en: "Shall we grab a taxi?"
