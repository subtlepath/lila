dialogue:
  title: Antes y ahora
  title_en: Then and now
  lines:
    - speaker: Tom
      es: "Buenas tardes, doña Laura. ¿Le ayudo con las bolsas?"
      en: "Good afternoon, doña Laura. Can I help you with your bags?"
    - speaker: Laura
      es: "Ay, gracias, Tom. Eres muy amable."
      en: "Oh, thank you, Tom. You're very kind."
    - speaker: Tom
      es: "Doña Laura, ¿usted era maestra?"
      en: "Doña Laura, were you a teacher?"
    - speaker: Laura
      es: "Sí, [fui|ser] maestra de primaria treinta años. Enseñaba español."
      en: "Yes, I was an elementary school teacher for thirty years. I taught Spanish."
    - speaker: Tom
      es: "¿Y cómo era el barrio antes?"
      en: "And what was the neighborhood like back then?"
    - speaker: Laura
      es: "Era más tranquilo. No había metro, y yo caminaba a la escuela todos los días."
      en: "It was quieter. There was no metro, and I walked to school every day."
    - speaker: Tom
      es: "¿Y era difícil?"
      en: "And was it hard?"
    - speaker: Laura
      es: "Los niños eran muy traviesos, pero la vida era más fácil. Todo cambió."
      en: "The kids were very naughty, but life was easier. Everything has changed."
