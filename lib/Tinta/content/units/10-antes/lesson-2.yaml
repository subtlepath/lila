number: 2
title: En la secundaria
title_en: In middle school
level: A2
reviewer_notes:
  - "Culture note facts: primaria six years, secundaria three, prepa three; the UNAM described as the largest university in Mexico; many schools hold honores a la bandera on Monday mornings. Accurate?"
  - "'Primero de secundaria' translated as 'seventh grade'. OK?"
  - "'¿Me puede cambiar un billete de quinientos?' for 'Can you break a 500?'. Natural?"
  - "Doña Laura (older) says tú to Tom; Tom says usted to her."
new: [primaria, secundaria, prepa, universidad, clase, examen, enseñar, difícil, fácil, barrio, vida, cambiar]
conjugate: ["tener:impf", "estudiar:impf", "vivir:impf"]
notes:
  - kind: grammar
    title: Habits and descriptions in the past
    text: |
      Use the imperfect for the background of the past:

      - what used to happen: _Siempre estudiaba en la noche._ (I always studied at night.)
      - what things and people were like: _La escuela era chica._
      - age and time: _Tenía doce años._ _Eran las ocho._

      To compare then and now, pair the imperfect with the present: _Antes vivía en Puebla; ahora vivo aquí._

      _Ya no_ means "not any more": _Ya no estudio._ (I don't study any more.) _El barrio ya no es tranquilo._ (The neighborhood isn't quiet any more.)
  - kind: culture
    title: School in Mexico
    text: |
      Mexican schooling has four steps:

      - _primaria_ — elementary school, six years, from about age six
      - _secundaria_ — middle school, three years (grades seven to nine)
      - _prepa_, short for _preparatoria_ — high school, three years
      - _universidad_ — university; the UNAM in Mexico City is the largest in the country

      School years are counted inside each step: _primero de secundaria_ is seventh grade.

      Many schools have uniforms, and on Monday mornings many hold _honores a la bandera_, a short ceremony to the flag with the national anthem.
