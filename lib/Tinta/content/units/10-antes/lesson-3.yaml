number: 3
title: Cuando tembló
title_en: When the earthquake hit
level: A2
reviewer_notes:
  - "Facts to check in the culture note: the alert gives up to about a minute of warning for quakes on the Pacific coast and little or none for nearby ones; a big simulacro is often held on 19 September."
  - "The drill motto is written 'No corro, no grito, no empujo' (the plan had 'No grito, no corro, no empujo'). Which order do schools use?"
  - "Ana is on the tenth floor and leaves by the stairs only after the shaking stops, as civil-protection guidance says. Is the dialogue right?"
  - "'Hoy hay simulacro' without an article. Natural?"
new: [temblor, temblar, alerta, simulacro, sonar, mientras, escalera, caerse, romperse, gritar, empujar, asustado]
conjugate: ["estar:impf", "caerse:pret", "sonar:pret.3s", "temblar:pret.3s"]
notes:
  - kind: grammar
    title: Preterite and imperfect together
    text: |
      A story about the past needs both tenses. The imperfect sets the scene; the preterite tells what happened.

      - scene: _Estaba en la oficina. Llovía._ (I was at the office. It was raining.)
      - event: _Sonó la alerta. Tembló._ (The alarm went off. The earthquake hit.)

      _Mientras_ (while) goes with the imperfect, for the background; _cuando_ (when) often goes with the preterite, for the event that cuts in:

      - _Mientras trabajaba, sonó la alerta._
      - _Estaba en el metro cuando tembló._
  - kind: culture
    title: Earthquakes in Mexico City
    text: |
      Mexico City lies in an earthquake zone, and people there know what to do.

      - The _alerta sísmica_ is a siren played on loudspeakers across the city. For strong quakes that start far away, on the Pacific coast, it can sound up to about a minute before the shaking arrives. For quakes that start closer, it gives little or no warning.
      - Offices and schools hold _simulacros_ (drills). A big one is often held on 19 September, the date of the strong earthquakes of 1985 and 2017.
      - The drill rule every child learns: _No corro, no grito, no empujo._ (I don't run, I don't shout, I don't push.) If there is time, people on low floors go outside; higher up, they move to a safe spot away from windows. When the shaking stops, everyone leaves by the stairs, never the elevator, and meets outside.
  - kind: usage
    title: Temblor
    text: |
      Mexicans call any earthquake _un temblor_, and say _tembló_ (it shook) for "there was an earthquake". _Terremoto_ is kept for a big, destructive one.

      - _¿Sentiste el temblor?_ — Did you feel the earthquake?
      - _¡Está temblando!_ — There's an earthquake!
      - _Anoche tembló._ — There was an earthquake last night.

      Used this way, _temblar_ has no subject, like _llover_.
