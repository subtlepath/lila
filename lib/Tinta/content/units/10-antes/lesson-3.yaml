dialogue:
  title: ¿Dónde estabas?
  title_en: Where were you?
  lines:
    - speaker: Mariana
      es: "¡Ana! ¿Estás bien? ¿Dónde estabas cuando tembló?"
      en: "Ana! Are you OK? Where were you when the earthquake hit?"
    - speaker: Ana
      es: "Estaba en la oficina, en el piso diez. Estaba trabajando cuando sonó la alerta."
      en: "I was at the office, on the tenth floor. I was working when the alarm went off."
      allow: [piso]
    - speaker: Mariana
      es: "¿Y qué hicieron?"
      en: "And what did you do?"
    - speaker: Ana
      es: "Cuando terminó el temblor, salimos por la escalera, [como|como] en el simulacro: no corro, no grito, no empujo."
      en: "When the shaking stopped, we went out by the stairs, like in the drill: don't run, don't shout, don't push."
    - speaker: Mariana
      es: "¿Pasó algo en la oficina?"
      en: "Did anything happen at the office?"
    - speaker: Ana
      es: "Mientras temblaba, se cayó un vaso y se rompió. Estaba muy asustada, pero todos estamos bien. ¿Y tú?"
      en: "While it was shaking, a glass fell and broke. I was really scared, but we're all fine. What about you?"
    - speaker: Mariana
      es: "Yo iba en el metro. ¡No supe nada hasta que salí!"
      en: "I was on the metro. I didn't know a thing until I got out!"
    - speaker: Ana
      es: "¡Qué suerte!"
      en: "Lucky you!"
