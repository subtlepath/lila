dialogue:
  title: ¿Qué onda?
  title_en: What's up?
  lines:
    - speaker: Memo
      es: "¿Qué onda, güey? ¡Qué [bueno|bueno] que viniste!"
      en: "What's up, dude? Glad you made it!"
    - speaker: Chuy
      es: "¡Qué padre! La fiesta está bien chida."
      en: "How cool! The party's really great."
    - speaker: Tom
      es: "¿Saben qué? Tengo [trabajo|trabajo] nuevo."
      en: "You know what? I've got a new job."
    - speaker: Memo
      es: "¿Neta? ¡No manches! ¡Qué padre!"
      en: "Seriously? No way! That's awesome!"
    - speaker: Chuy
      es: "¡Híjole! Ya no tengo lana para más cervezas."
      en: "Oh no! I don't have any money left for more beers."
    - speaker: Memo
      es: "¡Ándale, vamos por tacos! Yo invito."
      en: "Come on, let's go get tacos! My treat."
    - speaker: Abuela
      es: "Buenas noches, jóvenes. ¿Ya cenaron?"
      en: "Good evening, young people. Have you had dinner yet?"
    - speaker: Memo
      es: "Buenas noches, abuela. ¿Cómo está usted? Ya nos íbamos a cenar unos tacos."
      en: "Good evening, Grandma. How are you? We were just leaving to have some tacos."
