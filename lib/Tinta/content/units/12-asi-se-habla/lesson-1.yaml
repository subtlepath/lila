number: 1
title: Entre cuates
title_en: Among friends
level: A2
reviewer_notes:
  - "'Me voy a Oaxaca. —¡Qué padre!' and Memo's 'Yo invito' (= my treat). Natural?"
  - "Register tags: güey, chavo, cuate, neta, chido, padre (cool), lana (money) informal; pinche vulgar. Confirm."
  - "güey, cuate and chavo are linked as near-synonyms, so they are never offered as each other's wrong answer. Do you agree they overlap that much?"
  - "Memo switches to usted and neutral Spanish when his grandmother walks in. Realistic?"
new: [cuate, güey, chavo, neta, chido, padre#cool, qué padre, no manches, híjole, ándale, lana#money, pinche]
conjugate: []
notes:
  - kind: usage
    title: Who you can say it to
    text: |
      This unit is about the Spanish Mexicans speak among friends. Tinta tags each of these words with its register:

      - *informal* words, such as _cuate, chavo, chido, padre, neta, no manches_ and _lana_, are fine with friends and people your age. With your boss, a police officer, a teacher or an older stranger they sound disrespectful.
      - *vulgar* words, such as _pinche_, are rude in polite company. Understand them when you hear them, but don't use them. Tinta hides vulgar words unless you switch them on in the settings.

      When an older person joins the group, Mexicans switch back to neutral Spanish and _usted_ without missing a beat. Do the same.
  - kind: usage
    title: Güey
    text: |
      _Güey_ (often written _wey_) is everywhere in the speech of young Mexicans. It once meant "ox", then "fool"; now friends use it like "dude", sometimes every few words: _¿Qué onda, güey?_

      Between friends it is affectionate. Said to a stranger, or in an angry tone, it is an insult. If you are not sure, leave it out.

      _No manches_ (no way!) is the polite cousin of _no mames_, which means the same but is vulgar. You will hear both; say the first.
  - kind: culture
    title: Mexican reactions
    text: |
      Mexican conversation is full of short reactions:

      - _¡Híjole!_ — oh no! yikes! (bad news, a surprise)
      - _¡Ándale!_ — come on! hurry up! that's it!
      - _¡No manches!_ — no way! you're kidding!
      - _¿Neta?_ — really? seriously? _La neta..._ — honestly...
      - _¡Qué padre!_ — how cool!

      To say OK, Mexicans say _sale_, _va_ or _órale_. ~Vale~ sounds Spanish.
