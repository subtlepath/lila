dialogue:
  title: En la tiendita
  title_en: At the corner store
  lines:
    - speaker: Lupe
      es: "Buenos días, joven. A sus órdenes."
      en: "Good morning, young man. What can I get you?"
    - speaker: Tom
      es: "Buenos días, doña Lupe. ¿Me regala una bolsa y un cafecito, por favor?"
      en: "Good morning, doña Lupe. Could I have a bag and a coffee, please?"
    - speaker: Lupe
      es: "Espéreme tantito. ¿Va a la escuela?"
      en: "Just a second. Are you going to school?"
    - speaker: Tom
      es: "No, ya tengo chamba. Es aquí cerquita, en la avenida."
      en: "No, I've got a job now. It's right near here, on the avenue."
    - speaker: Lupe
      es: "¡Qué [bueno|bueno]! Aquí está su cafecito. Son quince pesos."
      en: "That's great! Here's your coffee. That's fifteen pesos."
    - speaker: Tom
      es: "¡Híjole! Solo traigo un billete de quinientos."
      en: "Oh no! I only have a five-hundred-peso bill on me."
    - speaker: Lupe
      es: "No tengo [cambio|cambio]. Ni modo, [mañana|mañana] me paga. ¡Y échele [ganas|ganas] a la chamba!"
      en: "I don't have change. Oh well, you can pay me tomorrow. And give that job your all!"
    - speaker: Tom
      es: "¡Muchas gracias, doña Lupe! Hasta mañana."
      en: "Thanks so much, doña Lupe! See you tomorrow."
