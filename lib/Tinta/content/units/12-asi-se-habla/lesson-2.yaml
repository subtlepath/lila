number: 2
title: Un ratito
title_en: Just a moment
level: A2
reviewer_notes:
  - "Forms of address: doña Lupe uses usted with Tom throughout (the brief allowed an older shopkeeper to slip into tú with a regular). Should she?"
  - "'¿Me regala...?' is presented as very common in central Mexico. Regional or general?"
  - "tantito is tagged Mexico-specific; chamba informal. Tom says 'chamba' to doña Lupe in the dialogue: OK with an older shopkeeper?"
new: [poquito, ratito, tantito, cerquita, chiquito, cafecito, a sus órdenes, ni modo, regalar, echar, ganas, chamba]
conjugate: []
notes:
  - kind: grammar
    title: Diminutives
    text: |
      Mexicans add _-ito_ or _-ita_ to soften what they say, much more often than to say that something is small:

      - _poco_, _poquito_ (a little bit): the _c_ becomes _qu_
      - _rato_, _ratito_ (a little while)
      - _chico_, _chiquito_ (tiny)
      - _cerca_, _cerquita_ (very close)

      After _-e_, _-n_ or _-r_, and after a stressed final vowel, the ending is _-cito_: _café_, _cafecito_; _camión_, _camioncito_.

      A _cafecito_ is not a small coffee but a friendly one: _¿Nos tomamos un cafecito?_ And as you saw in Unit 1, _ahorita_ is not exactly _ahora_.
  - kind: usage
    title: Courtesy formulas
    text: |
      - _¿Me regala...?_ — Could I have...? _Regalar_ is to give as a present, but in a request there is no gift, and you still pay: _¿Me regala una bolsa?_ It is very common in central Mexico.
      - _A sus órdenes_ — at your service. Shop staff greet you with it, and people add it when they introduce themselves: _Me llamo Lupe, a sus órdenes._ You will also hear _para servirle_ and _con mucho gusto_.
      - _¿Gusta?_ — would you like some? Said when you are eating and someone arrives. The answer is _Gracias, provecho._
      - _Ni modo_ — oh well, nothing to be done.
  - kind: culture
    title: "¡Échale ganas!"
    text: |
      _Echarle ganas_ means to put your heart into something. You hear _¡Échale ganas!_ (give it your all!) from parents before an exam, from friends before a new job, from fans at a game. With usted it is _¡Échele ganas!_

      _Tantito_ (a tiny bit) is very Mexican: _Espérame tantito._ (Wait a sec.) _Tantito más._ (A tiny bit more.)

      _Chamba_ (job, work) is *informal*: _Tengo chamba nueva._ With your boss, say _trabajo_.
