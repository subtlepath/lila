dialogue:
  title: Siempre llego tarde
  title_en: I'm always late
  lines:
    - speaker: Mariana
      es: "¡Ana! Ya son las seis y media. ¿No te levantas?"
      en: "Ana! It's already six thirty. Aren't you getting up?"
    - speaker: Ana
      es: "Ahorita me levanto. ¿Estás en el baño?"
      en: "I'm getting up in a minute. Are you in the bathroom?"
    - speaker: Mariana
      es: "Sí. Me baño, me lavo los dientes y me arreglo."
      en: "Yes. I'm taking a shower, brushing my teeth and getting ready."
    - speaker: Ana
      es: "¿A qué hora [sales|salir]?"
      en: "What time are you leaving?"
    - speaker: Mariana
      es: "Salgo a las siete. ¿Y tú?"
      en: "I'm leaving at seven. And you?"
    - speaker: Ana
      es: "A las siete y media, pero siempre llego [tarde|tarde#late] al [trabajo|trabajo]."
      en: "At seven thirty, but I'm always late for work."
    - speaker: Mariana
      es: "¡Porque nunca te levantas temprano! Ya me voy. ¡Adiós!"
      en: "Because you never get up early! I'm off. Bye!"
    - speaker: Ana
      es: "¡Adiós! Ahorita me visto."
      en: "Bye! I'm getting dressed right now."
