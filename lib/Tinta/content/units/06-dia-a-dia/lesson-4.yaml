number: 4
title: Me levanto temprano
title_en: I get up early
level: A1
reviewer_notes:
  - "Usage note: me baño usually means I take a shower; most homes have a regadera; people shower every morning. Correct?"
  - "Is arreglarse glossed well as get ready, or dress up for an occasion?"
new: [despertarse, levantarse, bañarse, lavarse, diente, vestirse, arreglarse, salir, irse, acostarse, temprano, tarde#late]
conjugate: ["levantarse:pres", "acostarse:pres", "vestirse:pres", "salir:pres.1s"]
notes:
  - kind: grammar
    title: Reflexive verbs
    text: |
      Verbs that end in _-se_ describe something you do to or for yourself. They take a pronoun that matches the subject:

      - _me levanto_ — I get up
      - _te levantas_ — you get up
      - _se levanta_ — he, she gets up; you (_usted_) get up
      - _nos levantamos_ — we get up
      - _se levantan_ — they get up; you all get up

      The pronoun goes before the verb, or on the end of an infinitive: _Me baño._ _Quiero bañarme._

      Some verbs change meaning with _-se_. _Ir_ is to go; _irse_ is to leave: _Voy a la oficina_ (I'm going to the office), but _Ya me voy_ (I'm off). _Salir_ (to go out, to leave a place) is regular except for _yo_: _salgo_.
  - kind: usage
    title: Bañarse and arreglarse
    text: |
      In Mexico _me baño_ usually means I take a shower: most homes have a _regadera_, and people shower every morning before work or school.

      - _lavarse los dientes_ — to brush your teeth
      - _vestirse_ — to get dressed: _me visto, te vistes, se viste_ (e to i)
      - _arreglarse_ — to get ready, or to dress up for an occasion: _Mariana se arregla._

      Body parts take _el, la, los, las_, not _mi_: _Me lavo los dientes._ _Me lavo la cara._
