title: "Deck B: otoño to corto"
sentences:
  - es: "En {otoño} hace fresco."
    en: "In the fall it's cool."
    order: true
  - es: "¿Me trae el {menú}, por favor?"
    en: "Could you bring me the menu, please?"
  - es: "[Mañana|mañana] tengo cita con el {dentista}."
    en: "I have a dentist appointment tomorrow."
  - es: "No hay {jabón} en el baño."
    en: "There's no soap in the bathroom."
    order: true
  - es: "—Me caso en mayo. —¿{De veras}?"
    en: "I'm getting married in May. —Really?"
  - es: "El {supermercado} cierra a las diez."
    en: "The supermarket closes at ten."
  - es: "Puedes visitar muchos lugares, {por ejemplo}, Xochimilco."
    en: "You can visit lots of places, for example, Xochimilco."
  - es: "Necesito una {cuchara} para la sopa."
    en: "I need a spoon for the soup."
  - es: "[Escribe|escribir:imp.2s] la tarea en tu {cuaderno}."
    en: "Write the homework in your notebook."
    order: true
  - es: "[Llegamos|llegar:pret.1p] de la fiesta a las cuatro de la {madrugada}."
    en: "We got home from the party at four in the morning."
    note: "La madrugada: the hours after midnight, before dawn."
  - es: "¿Me trae un {tenedor}, por favor?"
    en: "Could you bring me a fork, please?"
  - es: "{Volteé} y no [había|haber:impf.3s] nadie."
    en: "I turned around and there was nobody there."
    note: "Voltear (Mexico): to turn around, to look back."
  - es: "Beto, {voltea|voltear:imp.2s} a la derecha en la esquina."
    en: "Beto, turn right at the corner."
  - es: "¡Cuidado con el {tope}!"
    en: "Watch out for the speed bump!"
  - es: "Hay que cambiar el {foco} de la cocina."
    en: "We need to change the kitchen light bulb."
    note: "Foco: light bulb. La luz is the light it gives."
  - es: "{Jala|jalar:imp.2s} la puerta, no la [empujes|empujar:impneg.2s]."
    en: "Pull the door, don't push it."
    note: "Door signs say Jale (pull) and Empuje (push)."
  - es: "Tu papá es muy {chistoso}."
    en: "Your dad is really funny."
    order: true
  - es: "Tengo que cambiar la {llanta}."
    en: "I have to change the tire."
    order: true
  - es: "Se {descompuso} el refri."
    en: "The fridge broke down."
    note: "Descomponerse is for machines; for things that snap or tear, romperse."
    order: true
  - es: "Se me {antoja} un helado."
    en: "I feel like an ice cream."
    note: "It works like gustar: se me antojan unos tacos."
  - es: "Anoche se me {antojaron} unos tacos."
    en: "Last night I got a craving for tacos."
  - es: "Los niños {brincan} en la cama."
    en: "The kids are jumping on the bed."
  - es: "Te pago en la {quincena}."
    en: "I'll pay you on payday."
    reviewer_notes: "'en la quincena' for 'on payday': natural, or 'cuando me paguen' / 'el día de quincena'?"
    note: "Many people in Mexico are paid every two weeks, on the fifteenth and at the end of the month."
  - es: "La leche está en el {refri}."
    en: "The milk is in the fridge."
    order: true
  - es: "Mi {vuelo} sale a las seis."
    en: "My flight leaves at six."
  - es: "[Trabajo|trabajar] en una {empresa} grande."
    en: "I work for a big company."
  - es: "[Fuimos|ir] a caminar al {bosque}."
    en: "We went for a walk in the woods."
  - es: "Dale un {beso} a tu abuela."
    en: "Give your grandma a kiss."
    order: true
  - es: "—Te presento a Luis. —{Encantada}."
    en: "This is Luis. —Pleased to meet you."
    note: "A man says encantado, a woman encantada."
  - es: "Su casa es {enorme}."
    en: "Their house is huge."
    order: true
  - es: "El refri está {vacío}."
    en: "The fridge is empty."
  - es: "Te traje un {detalle}."
    en: "I brought you a little gift."
    note: "Un detalle: a small gift or a kind gesture."
    order: true
  - es: "Quiero saber todos los {detalles}."
    en: "I want to know all the details."
  - es: "Mi papá {pintó} la casa de blanco."
    en: "My dad painted the house white."
  - es: "¿Te {fijaste} en el precio?"
    en: "Did you notice the price?"
  - es: "No me {fijé} en la hora."
    en: "I didn't notice the time."
    note: "Fijarse en: to notice, to pay attention to."
  - es: "Oaxaca está en el {sur} del país."
    en: "Oaxaca is in the south of the country."
  - es: "El sol de Cancún es muy fuerte para la {piel}."
    en: "The sun in Cancún is very strong on your skin."
  - es: "¿Está ocupado este {asiento}?"
    en: "Is this seat taken?"
    order: true
  - es: "La farmacia ya está {cerrada}."
    en: "The pharmacy is already closed."
    order: true
  - es: "Tuvimos una {conversación} muy larga."
    en: "We had a very long conversation."
  - es: "¿Vamos por un {trago}?"
    en: "Shall we go for a drink?"
    note: "Un trago is an alcoholic drink, or a sip."
  - es: "Mi hermana {renunció} a su [trabajo|trabajo]."
    en: "My sister quit her job."
  - es: "El molcajete es de {piedra}."
    en: "The molcajete is made of stone."
    order: true
  - es: "Luis está muy {enamorado} de Ana."
    en: "Luis is very much in love with Ana."
    note: "Enamorado de: in love with (de, not con)."
  - es: "Este restaurante es muy {famoso}."
    en: "This restaurant is very famous."
  - es: "Desde aquí se [ven|ver] las {montañas}."
    en: "You can see the mountains from here."
  - es: "—¿Va a llover [mañana|mañana]? —¡{Ojalá}!"
    en: "Is it going to rain tomorrow? —I hope so!"
  - es: "En {verano} llueve mucho en la Ciudad de México."
    en: "In summer it rains a lot in Mexico City."
  - es: "¡Qué bonito {anillo}!"
    en: "What a pretty ring!"
  - es: "Mi hijo es muy {responsable}."
    en: "My son is very responsible."
    order: true
  - es: "Me duele el {cuello}."
    en: "My neck hurts."
    order: true
  - es: "Mi abuelo lee el {periódico} todas las [mañanas|mañana#morning]."
    en: "My grandpa reads the newspaper every morning."
  - es: "Quiero el pelo más {corto}."
    en: "I want my hair shorter."
    note: "Corto is for length. A short person is chaparro or bajo."
