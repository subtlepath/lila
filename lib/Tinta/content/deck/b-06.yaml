title: "Deck B: polvo to risa"
sentences:
  - es: "La mesa está llena de {polvo}."
    en: "The table is covered in dust."
  - es: "Cumplí mi {promesa}."
    en: "I kept my promise."
    order: true
  - es: "Me quemé la {lengua} con el café."
    en: "I burned my tongue on the coffee."
  - es: "Les deseo mucha {felicidad}."
    en: "I wish you lots of happiness."
    order: true
  - es: "Anoche hubo una {tormenta} muy fuerte."
    en: "There was a really bad storm last night."
  - es: "¡Qué {lástima}! No puedo ir."
    en: "What a shame! I can't go."
  - es: "Hace mucho calor; vamos a la {sombra}."
    en: "It's really hot; let's go into the shade."
  - es: "¿Acepta tarjeta de {crédito}?"
    en: "Do you take credit cards?"
  - es: "Es una receta muy {sencilla}."
    en: "It's a very simple recipe."
  - es: "Un boleto {sencillo} a Puebla, por favor."
    en: "A one-way ticket to Puebla, please."
    note: "Sencillo: one-way. A round trip is redondo."
  - es: "No {mezcles|mezclar:impneg.2s} tu ropa blanca con la de color."
    en: "Don't mix your whites with your colors."
  - es: "Perdón por {interrumpir}."
    en: "Sorry to interrupt."
    order: true
  - es: "¿Qué {fecha} es hoy?"
    en: "What's the date today?"
    order: true
  - es: "[Deje|dejar:imp.3s] su mensaje con la {secretaria}."
    en: "Leave your message with the secretary."
  - es: "Tú y tu hermano son muy {parecidos}."
    en: "You and your brother look a lot alike."
  - es: "Señorita, ¿me {comunica} con la doctora Ruiz?"
    en: "Can you put me through to Dr. Ruiz, miss?"
    note: "On the phone, comunicar is to put someone through."
  - es: "¿Tienes un {mapa} de la ciudad?"
    en: "Do you have a map of the city?"
    note: "El mapa is masculine, though it ends in -a."
  - es: "Quiero {practicar} mi español contigo."
    en: "I want to practice my Spanish with you."
  - es: "Siempre {lavo} los platos después de cenar."
    en: "I always wash the dishes after dinner."
  - es: "¿Me ayudas a {lavar|lavar} el carro?"
    en: "Will you help me wash the car?"
    note: "Lavar is to wash something; washing yourself is lavarse."
  - es: "Estoy leyendo una {revista}."
    en: "I'm reading a magazine."
    order: true
  - es: "Necesito una {cuerda} para colgar la ropa."
    en: "I need a rope to hang the laundry on."
  - es: "{Aproveché} que estaba en el centro para ir al banco."
    en: "I was downtown, so I took the chance to go to the bank."
  - es: "Tengo una maleta de este {tamaño}."
    en: "I have a suitcase this size."
    note: "For clothes, Mexico says talla; for shoes, número."
  - es: "Llegó un {paquete} para ti."
    en: "A package came for you."
    order: true
  - es: "Mi gato se subió al {techo}."
    en: "My cat climbed up on the roof."
  - es: "No hay {internet} en el hotel."
    en: "There's no internet at the hotel."
  - es: "Estoy {harto} de la lluvia."
    en: "I'm sick of the rain."
    order: true
  - es: "Este mole está {delicioso}."
    en: "This mole is delicious."
  - es: "Mi abuela no puede caminar mucho por su {rodilla}."
    en: "My grandma can't walk much because of her knee."
  - es: "Estoy tomando un {curso} de [cocina|cocina]."
    en: "I'm taking a cooking class."
  - es: "Comimos pescado junto al {lago}."
    en: "We ate fish by the lake."
  - es: "¡Qué rico {olor}!"
    en: "What a lovely smell!"
  - es: "Mi hijo se {enfermó} otra vez."
    en: "My son got sick again."
    order: true
  - es: "Siempre me {enfermo} en invierno."
    en: "I always get sick in winter."
  - es: "Me metí en un {lío}."
    en: "I got myself into a mess."
    order: true
  - es: "Cerca de Monterrey hay {osos} negros."
    en: "There are black bears near Monterrey."
    reviewer_notes: "Fact check: black bears in the Sierra Madre near Monterrey (Chipinque)."
  - es: "¿Quieres una {nieve} de limón?"
    en: "Do you want a lime sorbet?"
    note: "In Mexico nieve is also a water-based ice cream."
  - es: "Mi hijo nunca vio la {nieve}."
    en: "My son has never seen snow."
  - es: "Estoy buscando {empleo}."
    en: "I'm looking for work."
  - es: "Todo tiene {solución}."
    en: "There's a solution for everything."
    order: true
  - es: "¿Vas a ver el {Mundial}?"
    en: "Are you going to watch the World Cup?"
  - es: "Ya pagué mi {deuda}."
    en: "I've paid off my debt."
  - es: "El internet está muy {lento}."
    en: "The internet is really slow."
    order: true
  - es: "Este libro es muy {útil}."
    en: "This book is very useful."
  - es: "Hubo un {incendio} en el mercado."
    en: "There was a fire at the market."
    note: "Un incendio: a fire that destroys things. Fuego: fire in general."
  - es: "¿Te sabes la {letra} de la canción?"
    en: "Do you know the lyrics to the song?"
  - es: "[Escribe|escribir:imp.2s] con {letra} grande, por favor."
    en: "Please write in big letters."
  - es: "Los niños usan {uniforme} en la escuela."
    en: "The kids wear a uniform at school."
  - es: "Me cuesta respirar por la {altura}."
    en: "It's hard for me to breathe because of the altitude."
  - es: "Nuestra {amistad} es muy importante para mí."
    en: "Our friendship is very important to me."
  - es: "No tengo ni un {centavo}."
    en: "I don't have a cent."
    order: true
  - es: "¿Cuál es la {clave} del internet?"
    en: "What's the internet password?"
  - es: "Llevo la bolsa en el {hombro}."
    en: "I carry my bag on my shoulder."
  - es: "Me dio mucha {risa}."
    en: "It made me laugh a lot."
