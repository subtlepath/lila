title: "Deck B: labio to salchicha"
sentences:
  - es: "Se pintó los {labios} de rojo."
    en: "She put on red lipstick."
  - es: "Mi {sobrina} cumple diez años."
    en: "My niece is turning ten."
    order: true
  - es: "¡Qué {alegría} verte!"
    en: "I'm so happy to see you!"
  - es: "El {ladrón} se llevó mi cartera."
    en: "The thief took my wallet."
  - es: "Nos vemos {pasado mañana}."
    en: "See you the day after tomorrow."
    order: true
  - es: "[Ponte|ponerse] el {abrigo}, hace frío."
    en: "Put your coat on, it's cold."
  - es: "Hay un {espejo} en el baño."
    en: "There's a mirror in the bathroom."
    order: true
  - es: "¿Qué {ruta} me lleva al centro?"
    en: "Which route takes me downtown?"
    note: "In many Mexican cities una ruta is a city bus or minibus line."
  - es: "¿Quieres una {galleta}?"
    en: "Do you want a cookie?"
  - es: "Mi abuela tiene diez {nietos}."
    en: "My grandma has ten grandchildren."
    order: true
  - es: "Tienes algo en la {oreja}."
    en: "You've got something on your ear."
  - es: "Ya me {alivié}, gracias."
    en: "I've gotten better, thanks."
    note: "Aliviarse (Mexico): to get better after an illness."
  - es: "¡Que te {alivies} pronto!"
    en: "Get well soon!"
    note: "A fixed formula: say it to anyone who is sick."
  - es: "Voy a estudiar en la {biblioteca}."
    en: "I'm going to study at the library."
    note: "Biblioteca is a library; a bookstore is una librería."
  - es: "Los niños están jugando en el {patio} de la escuela."
    en: "The kids are playing in the schoolyard."
  - es: "Gracias por la {invitación}."
    en: "Thanks for the invitation."
    order: true
  - es: "Tengo que [ponerle|poner] {gasolina} al carro."
    en: "I have to put gas in the car."
  - es: "¿Quieres tus quesadillas con {crema}?"
    en: "Do you want sour cream on your quesadillas?"
    note: "Mexican crema is a thin sour cream."
  - es: "El mole es un plato {típico} de Puebla."
    en: "Mole is a traditional dish from Puebla."
  - es: "Ya le agarré la {onda} al metro."
    en: "I've got the hang of the metro now."
    note: "Informal: only with friends. Agarrarle la onda: to get the hang of it."
    reviewer_notes: "'agarrarle la onda a algo' = get the hang of it: current and natural?"
  - es: "Tengo que entregar el {reporte} [mañana|mañana]."
    en: "I have to hand in the report tomorrow."
  - es: "Voy al {gimnasio} tres veces a la semana."
    en: "I go to the gym three times a week."
  - es: "¿Me pasas una {toalla}?"
    en: "Can you pass me a towel?"
  - es: "¿Cuál es el {horario} de la biblioteca?"
    en: "What are the library's hours?"
  - es: "Mi tío nos echó un {rollo} de dos horas."
    en: "My uncle gave us a two-hour lecture."
    note: "Informal: only with friends. Echar un rollo: to go on and on."
    reviewer_notes: "'nos echó un rollo' for a long boring talk: natural?"
  - es: "Me subieron el {sueldo}."
    en: "I got a raise."
    order: true
  - es: "Mi {padrino} me regaló una bicicleta."
    en: "My godfather gave me a bike."
  - es: "La {llegada} del vuelo es a las nueve."
    en: "The flight gets in at nine."
  - es: "No [seas|ser:impneg.2s] {grosero}."
    en: "Don't be rude."
  - es: "En México es {grosero} no saludar."
    en: "In Mexico it's rude not to say hello."
    reviewer_notes: "Would you say 'es grosero' here, or 'es de mala educación'?"
  - es: "Me da mucho {coraje} cuando no me avisan."
    en: "It makes me really mad when people don't tell me."
    note: "Mexico: me da coraje, it makes me angry. Coraje is rarely courage here."
  - es: "¿Qué hay de {postre}?"
    en: "What's for dessert?"
    order: true
  - es: "¿Dónde recojo mi {equipaje}?"
    en: "Where do I pick up my luggage?"
  - es: "¿Tienes {mascota}?"
    en: "Do you have a pet?"
  - es: "De [desayuno|desayuno] hay huevos con {salchicha}."
    en: "There are eggs and sausage for breakfast."
