title: "Frecuencia C, segunda parte"
sentences:
  - es: "A la salsa le falta {ajo}."
    en: "The salsa needs more garlic."
  - es: "¿Vas a ir a la {posada} de la oficina?"
    en: "Are you going to the office Christmas party?"
    note: "Posadas are the parties from 16 to 24 December."
  - es: "En diciembre vamos a muchas {posadas}."
    en: "In December we go to lots of Christmas parties."
  - es: "Tengo {alergia} al polvo."
    en: "I have a dust allergy."
  - es: "A esta hora hay mucho {tránsito} en Insurgentes."
    en: "At this time of day there's a lot of traffic on Insurgentes."
  - es: "Un {tránsito} me puso una multa."
    en: "A traffic cop gave me a ticket."
    note: "Un tránsito: a traffic police officer."
  - es: "Me encantan los tacos de {camarón}."
    en: "I love shrimp tacos."
  - es: "El {elevador} no sirve, vamos por la escalera."
    en: "The elevator isn't working; let's take the stairs."
  - es: "Tomamos el {micro} hasta el metro."
    en: "We took the minibus to the metro."
    order: true
    reviewer_notes: "Is micro still current in Mexico City, or mainly pesero now? (The row's note mentions both.)"
  - es: "Pon la sopa en el {microondas}."
    en: "Put the soup in the microwave."
    order: true
  - es: "¿Me da un asiento de {ventanilla}?"
    en: "Can I have a window seat?"
  - es: "Pague en la {ventanilla} dos."
    en: "Pay at window two."
  - es: "Mi {compadre} Beto es el padrino de mi hija."
    en: "My compadre Beto is my daughter's godfather."
    note: "Your child's godparents become your compadre and comadre."
  - es: "Los tacos [al pastor|al pastor] llevan {piña}."
    en: "Tacos al pastor come with pineapple."
  - es: "La ropa sigue en la {lavadora}."
    en: "The clothes are still in the washing machine."
  - es: "Mamá, me duele la {panza}."
    en: "Mom, my tummy hurts."
    note: "Informal: only with friends and family. Neutral: el estómago."
  - es: "¿Me prestas tu {cargador}? Se me [acabó|acabarse] la pila."
    en: "Can I borrow your charger? My battery died."
  - es: "Las carnitas son de {puerco}."
    en: "Carnitas are made of pork."
  - es: "Tengo una {reservación} a nombre de Ana Ruiz."
    en: "I have a reservation under the name Ana Ruiz."
  - es: "¿Cómo vas a {festejar} tu cumpleaños?"
    en: "How are you going to celebrate your birthday?"
  - es: "Ayer {festejamos} a mi abuela."
    en: "Yesterday we threw a party for my grandma."
    reviewer_notes: "Festejar a alguien for 'throw someone a party': natural?"
  - es: "Estoy muy {apenado}, se me olvidó tu cumpleaños."
    en: "I'm so embarrassed, I forgot your birthday."
    note: "In Mexico apenado means embarrassed or sorry, not sad."
  - es: "El niño quiere una {paleta} de limón."
    en: "The boy wants a lime popsicle."
  - es: "¿Me presta su {credencial}, por favor?"
    en: "May I see your ID, please?"
    note: "Mostly the INE voter card, used as ID everywhere."
  - es: "Cuando estoy enfermo, mi mamá me hace {caldo} de pollo."
    en: "When I'm sick, my mom makes me chicken soup."
  - es: "¿Vamos al {antro} el sábado?"
    en: "Shall we go clubbing on Saturday?"
    note: "Informal: only with friends."
  - es: "Son {trescientos} pesos."
    en: "That's three hundred pesos."
    order: true
  - es: "Hubo {trescientas} personas en la boda."
    en: "There were three hundred people at the wedding."
    note: "Trescientas before a feminine noun."
  - es: "Tómese este {jarabe} para la tos."
    en: "Take this cough syrup."
  - es: "La torta lleva jitomate, {lechuga} y aguacate."
    en: "The torta comes with tomato, lettuce and avocado."
  - es: "¡Cuidado con el {bache}!"
    en: "Watch out for the pothole!"
  - es: "Mis cuates me dicen {gringo} de cariño."
    en: "My buddies call me gringo as a term of endearment."
    note: "Informal: only with friends. Neutral: estadounidense."
    reviewer_notes: "Shows gringo used affectionately among friends. Is that realistic, and should gringo be taught at all (see the deck README's register question)?"
  - es: "No hay {bronca}, yo te ayudo."
    en: "No problem, I'll help you."
    note: "Informal: only with friends."
  - es: "Compré una {sandía} en el mercado."
    en: "I bought a watermelon at the market."
  - es: "Mi hija ya es {licenciada}."
    en: "My daughter is a college graduate now."
    note: "Also a title: el licenciado Ortega."
    reviewer_notes: "Ya es licenciada for 'has her college degree now': natural, or is ya se tituló more usual?"
  - es: "Un kilo de carne de {res}, por favor."
    en: "A kilo of beef, please."
  - es: "Mi abuela [ve|ver] la {telenovela} todas las noches."
    en: "My grandma watches the soap opera every night."
  - es: "Mi mamá me {regañó} por llegar [tarde|tarde#late]."
    en: "My mom told me off for getting home late."
  - es: "No {regañes} a tus hijos por todo."
    en: "Don't scold your kids for everything."
  - es: "Tu hermano es muy {buena onda}."
    en: "Your brother is really nice."
    note: "Informal: only with friends."
  - es: "El boleto cuesta {cuatrocientos} pesos."
    en: "The ticket costs four hundred pesos."
  - es: "Hace frío, ¿me pasas otra {cobija}?"
    en: "It's cold, can you pass me another blanket?"
  - es: "Pon la fruta en la {licuadora}."
    en: "Put the fruit in the blender."
  - es: "¿Dónde dejé mis {audífonos}?"
    en: "Where did I leave my headphones?"
    order: true
  - es: "El hotel cuesta {seiscientos} pesos la noche."
    en: "The hotel is six hundred pesos a night."
  - es: "Hoy te toca [lavar|lavar] los {trastes}."
    en: "It's your turn to do the dishes today."
    note: "Lavar los trastes: to do the dishes."
  - es: "¿Hay {wifi} aquí?"
    en: "Is there wifi here?"
  - es: "Mi papá nació en mil {novecientos} sesenta."
    en: "My dad was born in nineteen sixty."
    note: "Years are said as whole numbers: mil novecientos sesenta."
  - es: "Gano {ochocientos} pesos al día."
    en: "I earn eight hundred pesos a day."
  - es: "Son {setecientos} cincuenta pesos."
    en: "That's seven hundred and fifty pesos."
    note: "Siete becomes sete-: setecientos."
  - es: "Compré cuadernos en la {papelería}."
    en: "I bought notebooks at the stationery store."
  - es: "Los {chamacos} están jugando en la calle."
    en: "The kids are playing in the street."
    note: "Informal: only with friends."
  - es: "Pedí unas {enchiladas} verdes."
    en: "I ordered green enchiladas."
  - es: "Compra leche en la tienda de {abarrotes}."
    en: "Buy some milk at the corner store."
  - es: "En diciembre nos pagan el {aguinaldo}."
    en: "In December they pay us our Christmas bonus."
  - es: "¿Me {avientas} las llaves?"
    en: "Can you toss me the keys?"
  - es: "No {avientes} tu mochila al sillón."
    en: "Don't toss your backpack onto the couch."
