title: "Deck B: enfermedad to rosa"
sentences:
  - es: "Es una {enfermedad} grave."
    en: "It's a serious illness."
    order: true
  - es: "¿Sigues {despierto}?"
    en: "Are you still awake?"
  - es: "Mi {actor} favorito es mexicano."
    en: "My favorite actor is Mexican."
    order: true
  - es: "Conozco un {restaurante} muy [bueno|bueno] en la Condesa."
    en: "I know a really good restaurant in the Condesa."
  - es: "¿Hay un vuelo {directo} a Cancún?"
    en: "Is there a direct flight to Cancún?"
  - es: "Mi hermana está {embarazada}."
    en: "My sister is pregnant."
    note: "Embarazada means pregnant, not embarrassed (that is apenado or con pena)."
    order: true
  - es: "Una {botella} de agua, por favor."
    en: "A bottle of water, please."
  - es: "Mi abuelo tiene la {presión} alta."
    en: "My grandpa has high blood pressure."
  - es: "Hoy tengo el {turno} de noche."
    en: "Today I'm on the night shift."
  - es: "[Espere|esperar:imp.3s] su {turno}, por favor."
    en: "Please wait your turn."
  - es: "El {dueño} de la tienda es muy amable."
    en: "The owner of the store is very nice."
  - es: "Me {enamoré} de Guadalajara."
    en: "I fell in love with Guadalajara."
    note: "Enamorarse de: to fall in love with."
    order: true
  - es: "Hay mucho {ruido} en la calle."
    en: "There's a lot of noise in the street."
  - es: "¡[Quédate|quedarse] {quieto}!"
    en: "Keep still!"
  - es: "Tengo la {nariz} roja por la gripa."
    en: "My nose is red from my cold."
  - es: "Te mandé el {archivo} por correo."
    en: "I emailed you the file."
  - es: "¿Cómo vas a {celebrar} tu cumpleaños?"
    en: "How are you going to celebrate your birthday?"
  - es: "Estoy trabajando en un {proyecto} nuevo."
    en: "I'm working on a new project."
  - es: "¿Quieres un {pedazo} de pastel?"
    en: "Do you want a piece of cake?"
  - es: "¿Qué hora es? No traigo {reloj}."
    en: "What time is it? I don't have my watch on."
  - es: "¡Mamá, mi hermano me {pegó}!"
    en: "Mom, my brother hit me!"
  - es: "{Pega|pegar:imp.2s} la foto en tu cuaderno."
    en: "Stick the photo in your notebook."
  - es: "Me {pegué} en la rodilla con la mesa."
    en: "I banged my knee on the table."
    note: "Pegarse: to hit yourself by accident. Pegar: to hit someone or something."
  - es: "¡Ay! ¿Te {pegaste}?"
    en: "Ouch! Did you hurt yourself?"
  - es: "Tenemos cincuenta {invitados} para la boda."
    en: "We have fifty guests for the wedding."
  - es: "Mi vecino siempre se {queja} del ruido."
    en: "My neighbor always complains about the noise."
  - es: "Ya no te {quejes|quejarse:impneg.2s}."
    en: "Stop complaining."
    order: true
  - es: "El cajero está {fuera} de servicio."
    en: "The ATM is out of order."
  - es: "¿Quién es el {presidente} de tu país?"
    en: "Who's the president of your country?"
  - es: "Necesito hablar con un {abogado}."
    en: "I need to talk to a lawyer."
    order: true
  - es: "En el rancho de mi abuelo hay {caballos}."
    en: "There are horses on my grandpa's ranch."
  - es: "¡{Por fin} llegaste!"
    en: "You're here at last!"
  - es: "El vaso está {roto}."
    en: "The glass is broken."
    order: true
  - es: "—Ana no durmió anoche. —¡{Con razón} está tan cansada!"
    en: "Ana didn't sleep last night. —No wonder she's so tired!"
  - es: "No te [preocupes|preocuparse:impneg.2s], no es nada {grave}."
    en: "Don't worry, it's nothing serious."
  - es: "¿La cuenta {incluye} la propina?"
    en: "Does the check include the tip?"
  - es: "¿Vamos a la {lucha} libre el viernes?"
    en: "Shall we go to the wrestling on Friday?"
    note: "Lucha libre: Mexican professional wrestling, with masked wrestlers."
  - es: "Le tengo mucha {confianza} a mi doctora."
    en: "I trust my doctor a lot."
  - es: "Háblame de tú, hay {confianza}."
    en: "Call me tú, we're friends here."
    note: "Hay confianza: we're close enough for tú."
    reviewer_notes: "English 'Call me tú' keeps the Spanish word. Natural as an invitation from an older or senior person?"
  - es: "¡Qué {cantidad} de gente!"
    en: "What a lot of people!"
  - es: "Comimos {puros} tacos en el viaje."
    en: "We ate nothing but tacos on the trip."
    note: "Puro, pura (Mexico): nothing but."
  - es: "Eso es {puro} [cuento|cuento]."
    en: "That's all made up."
    order: true
  - es: "La tormenta trae {vientos} de cien kilómetros por hora."
    en: "The storm is bringing winds of a hundred kilometers an hour."
    note: "Everyday Mexico also says hace mucho aire: it's very windy."
  - es: "Quiero {reservar} una mesa para cuatro."
    en: "I'd like to book a table for four."
  - es: "{Por cierto}, ¿cómo está tu mamá?"
    en: "By the way, how's your mom?"
  - es: "Ya me {acostumbré} a la comida picante."
    en: "I'm used to spicy food now."
  - es: "No me {acostumbro} al frío."
    en: "I can't get used to the cold."
    order: true
  - es: "Mis hijos estudian en un {colegio} cerca de la casa."
    en: "My kids go to a private school near the house."
    note: "In Mexico un colegio is usually a private school."
  - es: "Tu cuarto es un {desastre}."
    en: "Your room is a mess."
    order: true
  - es: "[Revisa|revisar:imp.2s] tu {correo}."
    en: "Check your email."
  - es: "¿Dónde está el {correo}?"
    en: "Where's the post office?"
  - es: "Ya firmé el {contrato} del departamento."
    en: "I've signed the lease on the apartment."
  - es: "Me duele mucho el {pecho}."
    en: "My chest hurts a lot."
  - es: "Nos vemos en la {fuente} del parque."
    en: "Let's meet at the fountain in the park."
  - es: "[Tomamos|tomar:pret.1p] el {autobús} a Puebla."
    en: "We took the bus to Puebla."
    note: "Autobús is for long-distance coaches; a city bus is un camión."
  - es: "Mi mamá me [leía|leer:impf.3s] un {cuento|cuento} cada noche."
    en: "My mom used to read me a story every night."
  - es: "Después de la gripa me siento muy {débil}."
    en: "After the flu I feel very weak."
  - es: "Un refresco sin {hielo}, por favor."
    en: "A soda with no ice, please."
  - es: "Me gusta tu playera {rosa}."
    en: "I like your pink T-shirt."
    note: "Rosa often does not change: playeras rosa."
    order: true
