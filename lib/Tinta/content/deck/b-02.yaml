title: "Deck B: estado to mochila"
sentences:
  - es: "¿De qué {estado} eres?"
    en: "What state are you from?"
    note: "Mexico has thirty-two states, counting Mexico City."
    order: true
  - es: "En México nos reímos de la {muerte}."
    en: "In Mexico we laugh at death."
  - es: "Se {paró} y se [fue|irse] sin pagar."
    en: "He stood up and left without paying."
    note: "In Mexico pararse is to stand up, not only to stop."
  - es: "Beto, no te {pares|pararse:impneg.2s} en la silla."
    en: "Beto, don't stand on the chair."
  - es: "Tengo que arreglar un {asunto} en el banco."
    en: "I have some business to sort out at the bank."
  - es: "Por {seguridad}, [cierra|cerrar:imp.2s] la puerta con llave."
    en: "For safety, lock the door."
  - es: "[Guarda|guardar:imp.2s] el {resto} para [mañana|mañana]."
    en: "Save the rest for tomorrow."
    order: true
  - es: "[Ponte|ponerse] un sombrero, te {protege} del sol."
    en: "Put on a hat, it protects you from the sun."
  - es: "Disculpe, ¿tiene {fuego}?"
    en: "Excuse me, do you have a light?"
  - es: "[Cocina|cocinar:imp.2s] los frijoles a {fuego} lento."
    en: "Cook the beans over low heat."
    note: "A house fire is un incendio; fuego is fire in general."
  - es: "¡Lo {logramos|lograr:pret.1p}!"
    en: "We did it!"
  - es: "Me gustan {ambas} opciones."
    en: "I like both options."
    note: "In everyday speech Mexicans often say los dos, las dos."
    order: true
  - es: "Ese restaurante ya no {existe}."
    en: "That restaurant doesn't exist anymore."
    order: true
  - es: "¿Dónde está el {control} de la tele?"
    en: "Where's the TV remote?"
    note: "El control: the remote control, in Mexico."
  - es: "Entiendo tu {situación}."
    en: "I understand your situation."
    order: true
  - es: "Mi hermana trabaja en una {compañía} de [seguros|seguro#insurance]."
    en: "My sister works for an insurance company."
  - es: "Gracias por tu {compañía}."
    en: "Thanks for keeping me company."
    order: true
  - es: "Ese señor te está {engañando}."
    en: "That man is cheating you."
  - es: "¿Me pasas un {cuchillo}?"
    en: "Can you pass me a knife?"
  - es: "Pon los {platos} en la mesa."
    en: "Put the plates on the table."
    order: true
  - es: "El mole es mi {plato} favorito."
    en: "Mole is my favorite dish."
  - es: "¿Qué color {escogiste}?"
    en: "Which color did you pick?"
    order: true
  - es: "Le [compramos|comprar:pret.1p] un {pastel} de chocolate."
    en: "We got her a chocolate cake."
    note: "In Mexico a birthday cake is un pastel."
  - es: "[Tira|tirar:imp.2s] eso al {bote} de basura."
    en: "Throw that in the trash can."
  - es: "Esta maleta está muy {pesada}."
    en: "This suitcase is really heavy."
    order: true
  - es: "Tu primo es bien {pesado}; no deja de molestar."
    en: "Your cousin is so annoying; he won't stop bugging me."
    note: "Of a person, pesado means annoying."
    reviewer_notes: "Is 'bien pesado' with no informal tag right, or is pesado (annoying) informal?"
  - es: "¿Quieres un {helado} de chocolate?"
    en: "Do you want a chocolate ice cream?"
  - es: "Tomo café {diario}."
    en: "I drink coffee every day."
    note: "Diario (Mexico): every day, like todos los días."
    order: true
    reviewer_notes: "diario as an adverb is tagged neutral. Fine with anyone, or colloquial?"
  - es: "Los niños se {portaron} muy bien."
    en: "The kids behaved really well."
  - es: "Los niños ya están en el {salón}."
    en: "The kids are already in the classroom."
  - es: "La boda es en un {salón} de fiestas."
    en: "The wedding is at a party hall."
  - es: "Estoy {ahorrando} para un viaje."
    en: "I'm saving up for a trip."
    order: true
  - es: "Si tomas el metro, {ahorras} tiempo."
    en: "If you take the metro, you save time."
  - es: "Mi tío tiene una {camioneta} roja."
    en: "My uncle has a red pickup."
  - es: "¿Me da una {taza} de café?"
    en: "Can I have a cup of coffee?"
  - es: "Los viernes comemos {pescado}."
    en: "On Fridays we eat fish."
    reviewer_notes: "Meant as the Lent habit of fish on Fridays. Does it read naturally without saying en Cuaresma?"
    note: "On the plate it is pescado; a live fish is un pez."
    order: true
  - es: "En {invierno} hace frío en las [mañanas|mañana#morning]."
    en: "In winter it's cold in the mornings."
  - es: "La {sopa} está muy caliente."
    en: "The soup is very hot."
    order: true
  - es: "¿Le pones {azúcar} al café?"
    en: "Do you put sugar in your coffee?"
    note: "El azúcar, masculine."
  - es: "¿Vienes {seguido|seguido} a este lugar?"
    en: "Do you come here often?"
    note: "Seguido (Mexico): often."
  - es: "Mis papás vienen {seguido|seguido} a visitarnos."
    en: "My parents often come to visit us."
  - es: "Mi hermano se compró una {moto}."
    en: "My brother bought himself a motorcycle."
    note: "La moto is feminine, short for la motocicleta."
  - es: "En {primavera} hay muchas flores."
    en: "There are lots of flowers in spring."
    order: true
  - es: "Voy al {súper}, ¿necesitas algo?"
    en: "I'm going to the supermarket. Do you need anything?"
  - es: "El mesero nos {recomendó} el mole."
    en: "The waiter recommended the mole to us."
    note: "To ask a waiter: ¿Qué me recomienda?"
  - es: "Te {recomiendo} los tacos de la esquina."
    en: "I recommend the tacos on the corner."
  - es: "El {museo} está cerrado los lunes."
    en: "The museum is closed on Mondays."
    order: true
  - es: "Ya llegó el {recibo} de la luz."
    en: "The electric bill came."
    note: "El recibo de la luz: the electric bill."
  - es: "Le falta {aceite} al carro."
    en: "The car needs oil."
  - es: "Disculpe, ¿me presta una {pluma}?"
    en: "Excuse me, can I borrow a pen?"
    note: "In Mexico a pen is una pluma."
  - es: "Tengo mucha {sed}."
    en: "I'm really thirsty."
    note: "Tengo sed: I'm thirsty. Spanish has, not is."
    order: true
  - es: "¿Quieres más {arroz}?"
    en: "Do you want more rice?"
  - es: "¿Dónde {estacionaste} el carro?"
    en: "Where did you park the car?"
    order: true
  - es: "¿Cuántos {idiomas} hablas?"
    en: "How many languages do you speak?"
    note: "El idioma is masculine, though it ends in -a."
    order: true
  - es: "Para mí una {ensalada}, por favor."
    en: "A salad for me, please."
  - es: "El {estacionamiento} está lleno."
    en: "The parking lot is full."
  - es: "La ayudo {con gusto}, señora."
    en: "I'll gladly help you, ma'am."
    note: "Con gusto: gladly. It is also a common Mexican reply to gracias."
  - es: "¿Tienes un {lápiz}?"
    en: "Do you have a pencil?"
  - es: "[Deja|dejar:imp.2s] tu {mochila} aquí."
    en: "Leave your backpack here."
    order: true
