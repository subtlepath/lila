title: "Frecuencia C, sexta parte"
sentences:
  - es: "Me gusta el {pepino} con limón y chile."
    en: "I like cucumber with lime and chili."
  - es: "¿Puedes {regar} las plantas mientras no estoy?"
    en: "Can you water the plants while I'm away?"
  - es: "Yo {riego} el jardín los domingos."
    en: "I water the garden on Sundays."
  - es: "Mi abuelo iba a la {cantina} con sus amigos."
    en: "My grandpa used to go to the bar with his friends."
  - es: "Hay que llamar al {plomero}, el excusado no sirve."
    en: "We need to call the plumber; the toilet isn't working."
  - es: "Perdí un {arete} en la fiesta."
    en: "I lost an earring at the party."
  - es: "Llévate el {impermeable}, va a llover."
    en: "Take your raincoat, it's going to rain."
  - es: "Ese {morro} juega muy bien futbol."
    en: "That kid plays soccer really well."
    note: "Informal: only with friends."
  - es: "La {chapa} de la puerta está rota."
    en: "The lock on the door is broken."
  - es: "Mi {carnal} me prestó su carro."
    en: "My brother lent me his car."
    note: "Informal: only with friends."
    reviewer_notes: "Carnal for one's real brother: natural, or mainly for a close friend?"
  - es: "Deja el carro en la {cochera}."
    en: "Leave the car in the garage."
    order: true
  - es: "El tren sale del {andén} tres."
    en: "The train leaves from platform three."
    reviewer_notes: "Few passenger trains in Mexico: is andén more natural with the metro or the Tren Suburbano?"
  - es: "Los {albañiles} están construyendo la casa de al lado."
    en: "The construction workers are building the house next door."
  - es: "En la carretera hay que pagar en la {caseta}."
    en: "On the highway you have to pay at the tollbooth."
  - es: "El {electricista} viene [mañana|mañana] a arreglar la luz."
    en: "The electrician is coming tomorrow to fix the lights."
  - es: "Tu hermano es bien {gacho} conmigo."
    en: "Your brother is really nasty to me."
    note: "Informal: only with friends."
  - es: "En Monterrey les gusta mucho el {beisbol}."
    en: "In Monterrey they really like baseball."
  - es: "Voy a la {estética} a cortarme el pelo."
    en: "I'm going to the salon to get my hair cut."
  - es: "¡Qué {mala onda}! Nadie vino a mi fiesta."
    en: "That's so not cool! Nobody came to my party."
    note: "Informal: only with friends."
  - es: "Limpia el baño con {cloro}."
    en: "Clean the bathroom with bleach."
    order: true
  - es: "Los niños rompieron la {piñata}."
    en: "The kids broke the piñata."
    order: true
  - es: "Subimos al {cerro} para ver la ciudad."
    en: "We climbed the hill to see the city."
  - es: "[Mañana|mañana] nos dan la {boleta} de calificaciones."
    en: "Tomorrow they give us our report cards."
  - es: "Las papas con {chorizo} son mis favoritas."
    en: "Potatoes with chorizo are my favorite."
  - es: "Afuera del metro venden {gorditas}."
    en: "They sell gorditas outside the metro station."
  - es: "Saca la {sombrilla}, ya empezó a llover."
    en: "Get out the umbrella; it's started to rain."
  - es: "Para hacer {guacamole} necesitas aguacates."
    en: "To make guacamole you need avocados."
  - es: "De postre pedimos un {flan}."
    en: "We ordered a flan for dessert."
  - es: "Trae una {cubeta} con agua."
    en: "Bring a bucket of water."
  - es: "Límpiate los pies en el {tapete}."
    en: "Wipe your feet on the mat."
  - es: "Un {compa} del [trabajo|trabajo] me invitó a su boda."
    en: "A buddy from work invited me to his wedding."
    note: "Informal: only with friends."
  - es: "Vamos por {churros} con chocolate."
    en: "Let's go get churros and hot chocolate."
  - es: "No eches papel en el {excusado}."
    en: "Don't throw paper in the toilet."
    note: "The bowl is el excusado; the room is el baño."
  - es: "Ayer cayó {granizo} en la [tarde|tarde]."
    en: "It hailed yesterday afternoon."
  - es: "¿Tienes una {curita}? Me corté."
    en: "Do you have a Band-Aid? I cut myself."
  - es: "El dos de noviembre vamos al {panteón}."
    en: "On November second we go to the cemetery."
  - es: "En el desayuno siempre [como|comer] {papaya}."
    en: "I always eat papaya at breakfast."
  - es: "¿Me das una {mandarina}?"
    en: "Can I have a tangerine?"
  - es: "¿Ya llegamos? —{Ya mero}."
    en: "Are we there yet? —Almost."
  - es: "{Ya mero} termino, espérame."
    en: "I'm almost done, wait for me."
  - es: "El {ajolote} vive en Xochimilco."
    en: "The axolotl lives in Xochimilco."
  - es: "En la esquina venden {antojitos} muy ricos."
    en: "They sell really good snacks on the corner."
  - es: "Mi tía hace una {birria} deliciosa."
    en: "My aunt makes delicious birria."
  - es: "Prende el {boiler}, el agua está fría."
    en: "Turn on the water heater; the water's cold."
    note: "Many Mexican homes heat water in a gas boiler."
  - es: "Compramos un kilo de {carnitas}."
    en: "We bought a kilo of carnitas."
  - es: "Pusimos flores de {cempasúchil} en la ofrenda."
    en: "We put marigolds on the altar."
  - es: "¿Tienes un {cerillo}? No prende la estufa."
    en: "Do you have a match? The stove won't light."
  - es: "Este celular es muy {chafa}."
    en: "This phone is really shoddy."
    note: "Informal: only with friends."
  - es: "Mi esposo es {chilango}, pero yo soy de Monterrey."
    en: "My husband is from Mexico City, but I'm from Monterrey."
    note: "Informal: only with friends. Neutral: capitalino."
  - es: "Al niño le salió un {chipote} en la cabeza."
    en: "The boy got a bump on his head."
    note: "Informal: only with friends and family."
  - es: "La foto está {chueca|chueco}."
    en: "The picture is crooked."
    order: true
  - es: "Ese negocio está muy {chueco|chueco#shady}."
    en: "That deal is really shady."
    note: "Informal: only with friends."
  - es: "Pon las tortillas en el {comal}."
    en: "Put the tortillas on the griddle."
