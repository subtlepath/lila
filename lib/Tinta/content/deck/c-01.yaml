title: "Frecuencia C, primera parte"
sentences:
  - es: "Mi {materia} favorita es historia."
    en: "My favorite subject is history."
    order: true
  - es: "¿Qué {materias} tienes los lunes?"
    en: "What subjects do you have on Mondays?"
  - es: "Mi {cuñado} es el esposo de mi hermana."
    en: "My brother-in-law is my sister's husband."
  - es: "El domingo voy a comer con mi {cuñada}."
    en: "On Sunday I'm having lunch with my sister-in-law."
  - es: "Deje las llaves en la {recepción}, por favor."
    en: "Please leave the keys at the front desk."
  - es: "La {recepción} está abierta toda la noche."
    en: "The front desk is open all night."
  - es: "¿Le pongo {mantequilla} al pan?"
    en: "Shall I put butter on the bread?"
  - es: "Llevé el carro al {taller}."
    en: "I took the car to the shop."
    order: true
  - es: "El carro está en el {taller} desde el lunes."
    en: "The car has been in the shop since Monday."
  - es: "Compramos {muebles} nuevos para la sala."
    en: "We bought new furniture for the living room."
    note: "Un mueble is one piece; los muebles is furniture."
  - es: "Este plátano todavía no está {maduro}."
    en: "This banana isn't ripe yet."
  - es: "Tu hermano es muy {maduro} para su edad."
    en: "Your brother is very mature for his age."
  - es: "No me gustan las {matemáticas}."
    en: "I don't like math."
    note: "Always plural in Spanish: las matemáticas."
  - es: "Este calcetín tiene un {hoyo}."
    en: "This sock has a hole in it."
  - es: "Le {agregué} cebolla y cilantro a la salsa."
    en: "I added onion and cilantro to the salsa."
  - es: "Ahora {agregue} el arroz, señora."
    en: "Now add the rice, ma'am."
  - es: "El pastel ya está en el {horno}."
    en: "The cake is already in the oven."
  - es: "Te espero en la {cafetería} de la esquina."
    en: "I'll wait for you at the coffee shop on the corner."
  - es: "Mándame tu {ubicación} por WhatsApp."
    en: "Send me your location on WhatsApp."
    order: true
  - es: "¿Eres de Monterrey? Tienes {acento} del norte."
    en: "Are you from Monterrey? You have a northern accent."
  - es: "Papá se escribe con {acento}."
    en: "Papá is written with an accent mark."
  - es: "¿Me trae otra {almohada}, por favor?"
    en: "Could you bring me another pillow, please?"
  - es: "¿Le molesta si prendo un {cigarro}?"
    en: "Do you mind if I light a cigarette?"
  - es: "¿Cuánto es el {pasaje}?"
    en: "How much is the fare?"
    order: true
  - es: "No encuentro mi otro {calcetín}."
    en: "I can't find my other sock."
  - es: "Los domingos comemos en el {comedor}."
    en: "On Sundays we eat in the dining room."
  - es: "El {comedor} de la oficina abre a la una."
    en: "The office cafeteria opens at one."
  - es: "Esa {falda} te queda muy bien."
    en: "That skirt looks great on you."
  - es: "Hay muchos {turistas} en el Zócalo."
    en: "There are lots of tourists in the Zócalo."
  - es: "Cambié las {sábanas} de la cama."
    en: "I changed the sheets on the bed."
  - es: "Alguien tocó el {timbre}."
    en: "Someone rang the doorbell."
    order: true
  - es: "Necesito un {timbre} para esta carta."
    en: "I need a stamp for this letter."
    note: "In Mexico a timbre is also a postage stamp."
    reviewer_notes: "Timbre for a postage stamp (lexicon sense): still current, or is estampilla more usual now?"
  - es: "El doctor me puso una {inyección}."
    en: "The doctor gave me a shot."
  - es: "La {consulta} cuesta trescientos pesos."
    en: "The doctor's visit costs three hundred pesos."
  - es: "Mis {suegros} vienen a comer el domingo."
    en: "My husband's parents are coming over for lunch on Sunday."
    note: "Mis suegros: your in-laws, your spouse's parents."
  - es: "Mi {suegra} [cocina|cocinar] muy rico."
    en: "My mother-in-law is a great cook."
  - es: "Llevamos a mi abuelo a {urgencias}."
    en: "We took my grandpa to the emergency room."
  - es: "¿Cuál es la {contraseña} del wifi?"
    en: "What's the wifi password?"
    order: true
  - es: "Vamos al {estadio} a ver el partido."
    en: "We're going to the stadium to watch the game."
  - es: "Ponte una {gorra}, hace mucho sol."
    en: "Put on a cap, it's really sunny."
  - es: "Me voy a poner la {pijama}."
    en: "I'm going to put on my pajamas."
    note: "Mexico says la pijama, singular, for the whole set."
  - es: "Los sábados hacemos carne {asada} en el patio."
    en: "On Saturdays we grill steak in the yard."
    reviewer_notes: "Hacer carne asada for a weekend cookout: natural outside the north too?"
  - es: "Compramos un pollo {asado} para la comida."
    en: "We bought a roast chicken for lunch."
  - es: "El {chofer} del camión no me dio [cambio|cambio]."
    en: "The bus driver didn't give me my change."
  - es: "Una torta de {jamón}, por favor."
    en: "A ham torta, please."
  - es: "¿Te gusta la camisa {morada}?"
    en: "Do you like the purple shirt?"
  - es: "Mis hijos desayunan {cereal} con leche."
    en: "My kids have cereal with milk for breakfast."
  - es: "Llegamos a la {terminal} a las ocho de la [mañana|mañana#morning]."
    en: "We got to the bus station at eight in the morning."
  - es: "¿Tiene {terminal}? —No, solo efectivo."
    en: "Do you have a card machine? —No, cash only."
    note: "¿Tiene terminal? asks whether a shop has a card machine."
    reviewer_notes: "Is ¿Tiene terminal? the everyday way to ask whether a shop takes cards?"
  - es: "En Año Nuevo comemos doce {uvas} a medianoche."
    en: "On New Year's Eve we eat twelve grapes at midnight."
  - es: "¿Me da dos {tostadas} de pollo?"
    en: "Can I have two chicken tostadas?"
  - es: "Le puse {zanahoria} a la ensalada."
    en: "I put carrot in the salad."
  - es: "¿Ya te pusiste la {vacuna}?"
    en: "Have you had your vaccine yet?"
  - es: "Los frijoles están en la {olla}."
    en: "The beans are in the pot."
  - es: "¡No seas {flojo}! Ayúdame."
    en: "Don't be lazy! Help me."
  - es: "Hoy estoy muy {floja}, no quiero hacer nada."
    en: "I'm feeling really lazy today; I don't want to do anything."
  - es: "Quiero un helado de {fresa}."
    en: "I'd like a strawberry ice cream."
  - es: "¡Qué {sabroso} está el mole!"
    en: "This mole is so tasty!"
  - es: "Tengo que {planchar} mi camisa."
    en: "I have to iron my shirt."
  - es: "¿Quién {planchó} esta camisa?"
    en: "Who ironed this shirt?"
  - es: "Llévate un {suéter}, va a hacer frío."
    en: "Take a sweater, it's going to be cold."
  - es: "El perro duerme en el {sillón}."
    en: "The dog sleeps on the couch."
  - es: "¿Un {tequila}? —No, gracias, voy a manejar."
    en: "A tequila? —No thanks, I'm driving."
  - es: "Saqué buena {calificación} en el examen."
    en: "I got a good grade on the test."
