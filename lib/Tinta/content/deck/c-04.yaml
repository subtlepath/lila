title: "Frecuencia C, cuarta parte"
sentences:
  - es: "Llegué [tarde|tarde#late] por el {tráfico}."
    en: "I was late because of the traffic."
  - es: "El niño {vomitó} en el carro."
    en: "The boy threw up in the car."
  - es: "Vivimos en un edificio muy {moderno}."
    en: "We live in a very modern building."
  - es: "¿Le pones {miel} al té?"
    en: "Do you put honey in your tea?"
  - es: "Ten {paciencia}, [ya mero|ya mero] llegamos."
    en: "Be patient, we're almost there."
  - es: "Los niños se {aburrieron} en el museo."
    en: "The kids got bored at the museum."
  - es: "Me {aburro} mucho en las reuniones."
    en: "I get really bored in meetings."
  - es: "Desde el avión se [ve|ver] el {océano}."
    en: "You can see the ocean from the plane."
  - es: "El barco llega al {puerto} a las seis."
    en: "The ship gets into port at six."
  - es: "¿Qué significa esta {frase}?"
    en: "What does this sentence mean?"
    order: true
  - es: "Tengo un {virus}, no puedo ir a trabajar."
    en: "I've got a virus; I can't go to work."
    reviewer_notes: "Tengo un virus for a stomach or flu bug: natural?"
  - es: "Esta silla es muy {incómoda}."
    en: "This chair is really uncomfortable."
  - es: "[Fue|ser] un silencio muy {incómodo}."
    en: "It was a really awkward silence."
  - es: "Mis papás se {divorciaron} cuando yo tenía diez años."
    en: "My parents got divorced when I was ten."
  - es: "Es {urgente}, necesito hablar con el doctor."
    en: "It's urgent; I need to talk to the doctor."
  - es: "Ponte las {botas}, está lloviendo."
    en: "Put on your boots, it's raining."
  - es: "Una {docena} de huevos, por favor."
    en: "A dozen eggs, please."
    order: true
  - es: "Me interesa mucho la {cultura} mexicana."
    en: "I'm really interested in Mexican culture."
  - es: "Llegamos a la casa a {medianoche}."
    en: "We got home at midnight."
  - es: "Hay una {clínica} aquí a la vuelta."
    en: "There's a clinic just around the corner."
  - es: "Ponte el {cinturón}."
    en: "Put your seat belt on."
    order: true
  - es: "Se me [rompió|romperse] la {pantalla} del celular."
    en: "My phone screen broke."
  - es: "La maestra tiene treinta {alumnos}."
    en: "The teacher has thirty students."
  - es: "La {bandera} de México es verde, blanca y roja."
    en: "The Mexican flag is green, white and red."
  - es: "El {guía} nos explicó la historia de Teotihuacán."
    en: "The guide told us the history of Teotihuacán."
  - es: "Se me [acabó|acabarse] la {pasta} de dientes."
    en: "I ran out of toothpaste."
  - es: "No [como|comer] nada {frito}."
    en: "I don't eat anything fried."
    order: true
  - es: "¿De qué {sabor} quieres el helado?"
    en: "What flavor ice cream do you want?"
  - es: "Los {pasajeros} tienen que bajarse aquí."
    en: "The passengers have to get off here."
  - es: "Las tortillas se hacen con {masa} de maíz."
    en: "Tortillas are made from corn dough."
  - es: "La {Revolución} mexicana empezó en mil novecientos diez."
    en: "The Mexican Revolution began in nineteen ten."
  - es: "Mi papá guarda sus {herramientas} en la cochera."
    en: "My dad keeps his tools in the garage."
  - es: "¡Qué {milagro}! Hace mucho que no te veo."
    en: "Long time no see! It's been ages."
    note: "¡Qué milagro! greets someone you haven't seen in a while."
  - es: "Dale un {abrazo} a tu mamá."
    en: "Give your mom a hug for me."
    order: true
  - es: "¿Ya le tomaste la {temperatura} al niño?"
    en: "Have you taken the boy's temperature yet?"
  - es: "¿Me puedes {traducir} este mensaje?"
    en: "Can you translate this message for me?"
  - es: "No te preocupes, yo te {traduzco}."
    en: "Don't worry, I'll translate for you."
  - es: "Quiero algo {ligero} para cenar."
    en: "I want something light for dinner."
  - es: "Los niños pidieron {hamburguesas}."
    en: "The kids ordered hamburgers."
  - es: "Vamos a la {plaza} a ver una película."
    en: "Let's go to the mall to see a movie."
    note: "In Mexico una plaza is often a shopping mall."
  - es: "Los domingos hay música en la {plaza} del pueblo."
    en: "On Sundays there's music in the town square."
  - es: "¿Cuál es su {apellido}?"
    en: "What's your last name?"
    order: true
  - es: "El {vendedor} me dio un buen precio."
    en: "The salesman gave me a good price."
  - es: "Compra dos {latas} de frijoles."
    en: "Buy two cans of beans."
  - es: "Los niños me dieron mucha {lata} hoy."
    en: "The kids were a real pain today."
    note: "Dar lata: to be a nuisance."
    reviewer_notes: "Dar lata for 'to be a pain': natural with mucha?"
  - es: "Romper la piñata es una {tradición} muy bonita."
    en: "Breaking the piñata is a lovely tradition."
  - es: "Mi mamá quería ser {cantante}."
    en: "My mom wanted to be a singer."
  - es: "Me corté las {uñas}."
    en: "I cut my nails."
  - es: "Mi abuela es una persona muy {alegre}."
    en: "My grandma is a very cheerful person."
  - es: "Mi hermano toca la {guitarra}."
    en: "My brother plays the guitar."
    order: true
  - es: "¡Hay un {ratón} en la cocina!"
    en: "There's a mouse in the kitchen!"
  - es: "Quiero hablar con el {gerente}."
    en: "I'd like to speak to the manager."
    order: true
  - es: "Los {bomberos} llegaron en cinco minutos."
    en: "The firefighters got here in five minutes."
  - es: "El {cocinero} de la fonda es mi tío."
    en: "The cook at the fonda is my uncle."
  - es: "Ponte el {casco} para [subirte|subirse] a la moto."
    en: "Put on your helmet before you get on the motorcycle."
