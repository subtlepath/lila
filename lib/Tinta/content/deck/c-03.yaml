title: "Frecuencia C, tercera parte"
sentences:
  - es: "Voy por unos {bolillos} para las tortas."
    en: "I'm going to get some rolls for the tortas."
  - es: "Trae algo de {botana} para el partido."
    en: "Bring some snacks for the game."
  - es: "Ponte las {chanclas} para ir a la playa."
    en: "Put on your flip-flops to go to the beach."
  - es: "Hay {chelas} en el refri."
    en: "There are some beers in the fridge."
    note: "Informal: only with friends. Neutral: cerveza."
  - es: "Desayuné {chilaquiles} verdes con huevo."
    en: "I had green chilaquiles with egg for breakfast."
  - es: "Esta {combi} va al centro."
    en: "This combi goes downtown."
    note: "A combi is a shared van on a fixed route."
    order: true
  - es: "Mi hija va al {kínder} en la [mañana|mañana#morning]."
    en: "My daughter goes to preschool in the morning."
  - es: "En la boda hubo {mariachi}."
    en: "There was a mariachi band at the wedding."
    reviewer_notes: "Hubo mariachi with no article, for 'there was a mariachi band': natural?"
  - es: "Esta salsa está muy {picosa}."
    en: "This salsa is really spicy."
    order: true
  - es: "Mi papá se {rasura} todas las [mañanas|mañana#morning]."
    en: "My dad shaves every morning."
  - es: "Me corté cuando me estaba {rasurando}."
    en: "I cut myself while I was shaving."
  - es: "Anoche hubo un {sismo} en Oaxaca."
    en: "There was an earthquake in Oaxaca last night."
    reviewer_notes: "Sismo is the news word (the row's note says speech uses temblor). Fine in a sentence that reports the news?"
  - es: "Pasa a la {tortillería} por un kilo de tortillas."
    en: "Stop at the tortilla shop for a kilo of tortillas."
  - es: "Ya barrí, ahora voy a {trapear}."
    en: "I've swept already; now I'm going to mop."
  - es: "¿Tienes una {moneda} de diez pesos?"
    en: "Do you have a ten-peso coin?"
  - es: "Esta cobija es muy {suave}."
    en: "This blanket is really soft."
    order: true
  - es: "Mi tío vive en la {frontera} con Estados Unidos."
    en: "My uncle lives on the border with the United States."
  - es: "La ropa ya está {seca}."
    en: "The clothes are dry now."
  - es: "¡{Felicidades}! Me dijeron que te casas."
    en: "Congratulations! I heard you're getting married."
  - es: "¡{Felicidades}, Ana! ¿Cuántos años cumples?"
    en: "Happy birthday, Ana! How old are you turning?"
  - es: "No quiero ir. {Aparte}, está lloviendo."
    en: "I don't want to go. Besides, it's raining."
  - es: "Las bebidas se pagan {aparte}."
    en: "Drinks are paid for separately."
  - es: "Ese perro tiene la {cola} muy larga."
    en: "That dog has a really long tail."
  - es: "Tu hija tiene una {sonrisa} muy bonita."
    en: "Your daughter has a lovely smile."
  - es: "Vamos a un restaurante {italiano}."
    en: "Let's go to an Italian restaurant."
    order: true
  - es: "¿Pedimos una {pizza}?"
    en: "Shall we order a pizza?"
  - es: "¿Tienes un {cable} para el celular?"
    en: "Do you have a cable for the phone?"
  - es: "A mi hijo le encanta {dibujar}."
    en: "My son loves to draw."
  - es: "La niña {dibujó} un perro."
    en: "The girl drew a dog."
  - es: "Mi abuelo come bien y está muy {sano}."
    en: "My grandpa eats well and is very healthy."
  - es: "¿Me das una {hoja}? Quiero escribir algo."
    en: "Can you give me a sheet of paper? I want to write something down."
  - es: "En otoño se caen las {hojas}."
    en: "In the fall the leaves come down."
  - es: "En el rancho de mi tío hay {vacas}."
    en: "There are cows on my uncle's ranch."
  - es: "Hay mucha {fila} en el banco."
    en: "There's a long line at the bank."
    note: "Hacer fila: to stand in line."
    reviewer_notes: "Hay mucha fila for 'there's a long line': natural?"
  - es: "Tuvimos que hacer {fila} una hora."
    en: "We had to stand in line for an hour."
  - es: "Esos tenis están de {moda}."
    en: "Those sneakers are in fashion."
  - es: "[Mañana|mañana] vamos a un {concierto} en el Zócalo."
    en: "Tomorrow we're going to a concert in the Zócalo."
  - es: "Puse un {anuncio} para vender mi carro."
    en: "I put up an ad to sell my car."
  - es: "Se me [cayó|caerse] un {botón} de la camisa."
    en: "A button came off my shirt."
  - es: "Mi papá siempre [cuenta|contar] el mismo {chiste}."
    en: "My dad always tells the same joke."
  - es: "Puse la {alarma} a las seis."
    en: "I set the alarm for six."
    order: true
  - es: "Me {asaltaron} en el camión."
    en: "I got mugged on the bus."
    note: "Me asaltaron: they robbed me, with threats or force."
  - es: "Estoy muy {emocionada} por el viaje."
    en: "I'm really excited about the trip."
  - es: "{Borré} la foto sin querer."
    en: "I deleted the photo by accident."
  - es: "Te mandé la foto, no la {borres}."
    en: "I sent you the photo; don't delete it."
  - es: "Me gusta {participar} en clase."
    en: "I like to take part in class."
  - es: "Un policía me pidió la {licencia}."
    en: "A police officer asked for my license."
  - es: "La mesa es de {madera}."
    en: "The table is made of wood."
    order: true
  - es: "Después del {divorcio}, mi tía se mudó a Puebla."
    en: "After the divorce, my aunt moved to Puebla."
  - es: "Los {adolescentes} duermen mucho."
    en: "Teenagers sleep a lot."
  - es: "¿Me ayudas con la {traducción} de esta carta?"
    en: "Can you help me with the translation of this letter?"
  - es: "La {educación} pública es gratis en México."
    en: "Public education is free in Mexico."
  - es: "Saludar es de buena {educación}."
    en: "Saying hello is good manners."
    note: "Educación also means manners."
  - es: "Me regalaron unos aretes de {plata}."
    en: "They gave me some silver earrings."
  - es: "Mi esposo es {estadounidense}, de Chicago."
    en: "My husband is American, from Chicago."
  - es: "Hoy no hay ni una {nube}."
    en: "There isn't a single cloud today."
  - es: "¿Vio las {placas} del carro?"
    en: "Did you see the car's license plate?"
    note: "Mexico usually says las placas, plural."
  - es: "¿Qué {deporte} te gusta?"
    en: "What sport do you like?"
    order: true
