title: "Frecuencia C, séptima parte"
sentences:
  - es: "Ahorita vengo, voy {de volada} a la tienda."
    en: "I'll be right back, I'm just running to the store."
    note: "Informal: only with friends."
  - es: "Esos {escuincles} no me dejan dormir."
    en: "Those brats won't let me sleep."
    note: "Informal: only with friends."
  - es: "¿Me da unos {esquites} con limón y chile?"
    en: "Can I have some esquites with lime and chili?"
  - es: "En la {glorieta}, tome la segunda salida."
    en: "At the traffic circle, take the second exit."
  - es: "Este dulce de {guayaba} está muy rico."
    en: "This guava candy is really good."
  - es: "¡{Guácala}! Hay una mosca en mi sopa."
    en: "Yuck! There's a fly in my soup."
    note: "Informal: only with friends."
  - es: "Compré {jícama}, pepino y mango para la botana."
    en: "I bought jícama, cucumber and mango for a snack."
  - es: "Mi mamá me hacía el {lonche} para la escuela."
    en: "My mom used to pack me a lunch for school."
    note: "Lonche is heard most in northern Mexico."
    reviewer_notes: "Lonche: northern only, or also heard in central Mexico?"
  - es: "El {metrobús} pasa por Insurgentes."
    en: "The Metrobús runs along Insurgentes."
    order: true
  - es: "En Oaxaca probamos un {mezcal} muy [bueno|bueno]."
    en: "In Oaxaca we tried a really good mezcal."
  - es: "Hace calor, ¿nos tomamos unas {micheladas}?"
    en: "It's hot. Shall we have some micheladas?"
  - es: "El quince de septiembre cenamos {pozole}."
    en: "On September fifteenth we have pozole for dinner."
  - es: "El {pulque} es una bebida muy antigua."
    en: "Pulque is a very old drink."
  - es: "Pedí dos {sopes} y una quesadilla."
    en: "I ordered two sopes and a quesadilla."
  - es: "Ya no hay agua en el {tinaco}."
    en: "There's no water left in the roof tank."
    note: "A tinaco is the water tank on the roof of most Mexican houses."
  - es: "Un jugo de {toronja}, por favor."
    en: "A grapefruit juice, please."
    order: true
  - es: "Me {mojé} todo por la lluvia."
    en: "I got soaked in the rain."
  - es: "¿Te {mojaste}? Aquí hay una toalla."
    en: "Did you get wet? Here's a towel."
  - es: "Me dio mucha {tristeza} la noticia."
    en: "The news made me really sad."
  - es: "¿Ya te {peinaste}? Vamos a llegar [tarde|tarde#late]."
    en: "Have you done your hair yet? We're going to be late."
  - es: "Mi hija ya se {peina} [sola|solo#alone]."
    en: "My daughter does her own hair now."
  - es: "Tengo el pelo {mojado}."
    en: "My hair is wet."
    order: true
  - es: "Se me olvidó el {cepillo} de dientes."
    en: "I forgot my toothbrush."
  - es: "Este café está muy {amargo}."
    en: "This coffee is really bitter."
    order: true
  - es: "En el metro hay {vagones} solo para mujeres."
    en: "On the metro there are cars just for women."
    reviewer_notes: "Fact: the Mexico City metro reserves the front cars for women and children."
  - es: "México metió un {gol} en el último minuto."
    en: "Mexico scored a goal in the last minute."
  - es: "El {huracán} llegó a Cancún en la noche."
    en: "The hurricane hit Cancún during the night."
  - es: "Mi abuela hace dulce de {calabaza} para Día de Muertos."
    en: "My grandma makes candied pumpkin for the Day of the Dead."
  - es: "Limpia la mesa con un {trapo}."
    en: "Wipe the table with a cloth."
    order: true
  - es: "La sopa está muy {salada}."
    en: "The soup is too salty."
  - es: "El doctor siempre es muy {puntual}."
    en: "The doctor is always very punctual."
  - es: "Tengo un {moretón} en la pierna."
    en: "I have a bruise on my leg."
  - es: "La {catedral} está en el Zócalo."
    en: "The cathedral is on the Zócalo."
  - es: "Mi papá tiene {diabetes} y no puede comer dulces."
    en: "My dad has diabetes and can't eat sweets."
  - es: "El vecino nuevo es muy {antipático}."
    en: "The new neighbor is really unfriendly."
