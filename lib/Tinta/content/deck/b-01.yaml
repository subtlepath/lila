title: "Deck B: luna to familiar"
sentences:
  - es: "Hoy en la noche hay {luna} llena."
    en: "There's a full moon tonight."
  - es: "Ese billete de quinientos es {falso}."
    en: "That five-hundred-peso bill is fake."
  - es: "Nos {mudamos|mudarse:pret.1p} a Guadalajara el año pasado."
    en: "We moved to Guadalajara last year."
    note: "Mudarse is moving house. Moving your body is moverse."
  - es: "¿Cuándo te {mudaste} a la Roma?"
    en: "When did you move to the Roma?"
    order: true
  - es: "Le compré {flores} a mi mamá."
    en: "I bought my mom some flowers."
    order: true
  - es: "Te espero en la {entrada} del metro."
    en: "I'll wait for you at the metro entrance."
  - es: "La {entrada} al museo es gratis los domingos."
    en: "Admission to the museum is free on Sundays."
    note: "La entrada is also the ticket or admission to a show."
    reviewer_notes: "Based on INAH museums being free on Sundays for Mexican nationals and residents. Too broad as a general statement?"
  - es: "Te llamé {varias} veces y no contestaste."
    en: "I called you several times and you didn't answer."
    note: "Varios, varias: several. Algunos: some, a few."
  - es: "No [pierdas|perder:impneg.2s] la {esperanza}."
    en: "Don't lose hope."
    order: true
  - es: "No {soporto} el ruido de la calle."
    en: "I can't stand the noise from the street."
    note: "Soportar is to put up with, not to support (that is apoyar)."
  - es: "¿Cuál es la {diferencia} entre un taco y una quesadilla?"
    en: "What's the difference between a taco and a quesadilla?"
  - es: "[Mañana|mañana] me dan el {resultado} del examen."
    en: "I get my exam result tomorrow."
  - es: "Prefiero la leche {entera}."
    en: "I prefer whole milk."
    order: true
  - es: "Llegó la ambulancia y {enseguida} se lo llevaron al hospital."
    en: "The ambulance came and they took him to the hospital right away."
    note: "Enseguida: right away. Pronto: soon."
  - es: "Mi abuela dice que el té {cura} todo."
    en: "My grandma says tea cures everything."
  - es: "Es un estacionamiento {privado}."
    en: "It's a private parking lot."
    order: true
  - es: "Mi hija tiene el pelo {chino}."
    en: "My daughter has curly hair."
    note: "In Mexico pelo chino is curly hair, not Chinese hair."
  - es: "¿Vamos a comer comida {china}?"
    en: "Shall we go eat Chinese food?"
  - es: "La {máquina} de café no funciona."
    en: "The coffee machine isn't working."
  - es: "Los domingos me {relajo} en casa."
    en: "On Sundays I relax at home."
    order: true
  - es: "¡Ya no {aguanto} el calor!"
    en: "I can't stand the heat anymore!"
  - es: "{Aguanta|aguantar:imp.2s}, Sofía, ya casi llegamos."
    en: "Hang on, Sofía, we're almost there."
  - es: "La tienda de la esquina está {abierta} hasta las diez."
    en: "The corner store is open until ten."
  - es: "Mi mamá me {colgó} el teléfono."
    en: "My mom hung up on me."
    note: "Colgar is to hang, and also to hang up the phone."
  - es: "{Cuelga|colgar:imp.2s} tu ropa en el clóset."
    en: "Hang your clothes in the closet."
  - es: "La comida de esta fonda es {excelente}."
    en: "The food at this fonda is excellent."
  - es: "{Finalmente} [decidimos|decidir:pret.1p] [quedarnos|quedarse] en casa."
    en: "In the end we decided to stay home."
  - es: "Mi hermano toca en una {banda|banda}."
    en: "My brother plays in a band."
  - es: "El sábado salgo con la {banda|banda#friends}."
    en: "On Saturday I'm going out with my friends."
    note: "Informal: only with friends. La banda: your group of friends."
  - es: "Me encanta el {arte} mexicano."
    en: "I love Mexican art."
    order: true
  - es: "Con este ruido {apenas} te oigo."
    en: "With this noise I can barely hear you."
  - es: "¿Cuál es su {destino}, señor?"
    en: "What's your destination, sir?"
  - es: "Lo voy a intentar {de nuevo}."
    en: "I'm going to try again."
    note: "Also otra vez."
    order: true
  - es: "El cuarto está muy {oscuro}. ¿Prendes la luz?"
    en: "The room is really dark. Can you turn on the light?"
  - es: "La fiesta [fue|ser] un {éxito}."
    en: "The party was a success."
    note: "Éxito is success, not exit. The exit is la salida."
    order: true
  - es: "Mi {gato} duerme todo el día."
    en: "My cat sleeps all day."
  - es: "Ana y Luis son una {pareja} muy bonita."
    en: "Ana and Luis are a lovely couple."
  - es: "¿Vas a venir con tu {pareja}?"
    en: "Are you coming with your partner?"
  - es: "¿Tiene {experiencia} en ventas?"
    en: "Do you have sales experience?"
  - es: "[Trata|tratar:imp.2s] a todos con {respeto}."
    en: "Treat everyone with respect."
    order: true
  - es: "En el tianguis los {precios} son muy buenos."
    en: "The prices at the tianguis are really good."
  - es: "¿Cuál es tu comida {favorita}?"
    en: "What's your favorite food?"
    order: true
  - es: "Me {lastimé} la rodilla jugando futbol."
    en: "I hurt my knee playing soccer."
    note: "Me lastimé la mano: I hurt my hand. No possessive with body parts."
  - es: "Maestra, ¿me da un {ejemplo}?"
    en: "Could you give me an example, Miss?"
    reviewer_notes: "'Maestra' to a female teacher, translated 'Miss'. Natural?"
  - es: "Cuando estoy enfermo tomo {té} con limón."
    en: "When I'm sick I drink tea with lime."
    note: "Té has an accent; te without one is the pronoun."
  - es: "Monterrey está en el {norte} de México."
    en: "Monterrey is in the north of Mexico."
  - es: "Vamos a pintar la {pared} de azul."
    en: "We're going to paint the wall blue."
  - es: "Mi papá ya no {fuma}."
    en: "My dad doesn't smoke anymore."
    order: true
  - es: "Disculpe, ¿dónde está la {salida}?"
    en: "Excuse me, where's the exit?"
  - es: "La {salida} del camión es a las ocho."
    en: "The bus leaves at eight."
    note: "La salida is also a departure."
    reviewer_notes: "Meant as a long-distance bus at a terminal. Natural with camión, or is autobús better here?"
  - es: "La novia de Diego es {francesa}."
    en: "Diego's girlfriend is French."
    note: "Nationalities are not capitalized in Spanish."
  - es: "Hay un {río} cerca del pueblo."
    en: "There's a river near the town."
  - es: "[Fuimos|ir] a una {isla} cerca de Cancún."
    en: "We went to an island near Cancún."
  - es: "Tu playera está {sucia}."
    en: "Your T-shirt is dirty."
    order: true
  - es: "Todas las tardes {paseo} al perro en el parque."
    en: "Every afternoon I walk the dog in the park."
  - es: "Las llaves están {debajo} de la cama."
    en: "The keys are under the bed."
    note: "Mexico often says abajo de: abajo de la cama."
  - es: "Mi tío llegó {borracho} a la boda."
    en: "My uncle showed up drunk at the wedding."
  - es: "Es un {familiar} de mi esposa."
    en: "He's one of my wife's relatives."
    note: "Un familiar is a relative, not someone familiar."
