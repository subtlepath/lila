title: "Frecuencia C, quinta parte"
sentences:
  - es: "Estás muy {delgada}. ¿Estás comiendo bien?"
    en: "You're very thin. Are you eating well?"
  - es: "El {mecánico} dice que el carro ya está listo."
    en: "The mechanic says the car is ready."
  - es: "Hay muchas {moscas} en la cocina."
    en: "There are lots of flies in the kitchen."
  - es: "Cierra las {cortinas}, por favor."
    en: "Close the curtains, please."
    order: true
  - es: "Tu hijo es muy {educado}."
    en: "Your son is very polite."
    note: "Educado means polite, not educated."
  - es: "Las cucharas están en el {cajón} de arriba."
    en: "The spoons are in the top drawer."
  - es: "Tengo mucho {estrés} por el trabajo."
    en: "I'm really stressed about work."
  - es: "Se me [acabó|acabarse] la {pila}."
    en: "My battery died."
    note: "In Mexico a phone battery is la pila."
  - es: "Necesito dos {pilas} para el reloj."
    en: "I need two batteries for the clock."
  - es: "¿Tiene {feria}? Solo traigo un billete de quinientos."
    en: "Do you have change? I've only got a five-hundred-peso bill."
  - es: "Vamos a la {feria} del pueblo."
    en: "Let's go to the town fair."
    order: true
  - es: "Me lastimé el {tobillo} jugando futbol."
    en: "I hurt my ankle playing soccer."
  - es: "En la playa tomamos agua de {coco}."
    en: "At the beach we drank coconut water."
  - es: "Siempre hay tráfico en ese {crucero}."
    en: "There's always traffic at that intersection."
  - es: "Mis papás se fueron de {crucero}."
    en: "My parents went on a cruise."
  - es: "Me duele el {codo|codo}."
    en: "My elbow hurts."
    order: true
  - es: "No seas {codo|codo#stingy}, invítame un café."
    en: "Don't be stingy, buy me a coffee."
    note: "Informal: only with friends. Codo (elbow) also means stingy."
  - es: "Mi hermana es {contadora}."
    en: "My sister is an accountant."
    order: true
  - es: "¿Quieres un {chicle}?"
    en: "Do you want a piece of gum?"
    order: true
  - es: "Soy {alérgico} a los camarones."
    en: "I'm allergic to shrimp."
  - es: "Llevo la ropa a la {lavandería} los sábados."
    en: "I take my clothes to the laundromat on Saturdays."
  - es: "Mi papá no está. ¿Le quiere dejar un {recado}?"
    en: "My dad isn't home. Would you like to leave him a message?"
  - es: "Desde aquí se [ve|ver] el {volcán}."
    en: "You can see the volcano from here."
  - es: "¡Hay una {cucaracha} en el baño!"
    en: "There's a cockroach in the bathroom!"
  - es: "Los domingos comemos tacos de {barbacoa}."
    en: "On Sundays we eat barbacoa tacos."
  - es: "Llevamos a los niños al {zoológico}."
    en: "We took the kids to the zoo."
  - es: "¿Compramos {palomitas} para la película?"
    en: "Shall we get popcorn for the movie?"
  - es: "Mi novia es {vegetariana}, no come carne."
    en: "My girlfriend is vegetarian; she doesn't eat meat."
  - es: "Desayunamos huevos con {tocino}."
    en: "We had bacon and eggs for breakfast."
  - es: "Don Toño es el {mero} mero de la empresa."
    en: "Don Toño is the big boss at the company."
    note: "Informal. El mero mero: the person in charge. Also el mero día: the very day."
    reviewer_notes: "The deck teaches el mero mero, not el mero día: in 'the very day' mismo and propio fit as well and would be second right answers in the cloze. Is el mero mero informal enough to need the note?"
  - es: "El {taxista} no sabía dónde estaba la calle."
    en: "The taxi driver didn't know where the street was."
  - es: "Hay una {gasolinera} en la esquina."
    en: "There's a gas station on the corner."
  - es: "Una {concha} y un café, por favor."
    en: "A sweet bun and a coffee, please."
    note: "A concha is a sweet bun with a sugar topping like a shell."
  - es: "Los niños buscan {conchas} en la playa."
    en: "The kids are looking for shells on the beach."
  - es: "Los niños juegan en el {pasto}."
    en: "The kids are playing on the grass."
  - es: "¿Me pasa la sal y la {pimienta}?"
    en: "Could you pass me the salt and pepper?"
  - es: "Me picó un {mosquito}."
    en: "A mosquito bit me."
  - es: "¡Cuidado, hay una {víbora}!"
    en: "Careful, there's a snake!"
  - es: "Para el pastel necesitas {harina}, huevos y azúcar."
    en: "For the cake you need flour, eggs and sugar."
  - es: "Dejo al bebé en la {guardería} a las ocho."
    en: "I drop the baby off at daycare at eight."
  - es: "Lávate las manos en el {lavabo}."
    en: "Wash your hands in the sink."
    order: true
  - es: "Ponte la {bufanda}, hace mucho frío."
    en: "Put on your scarf, it's really cold."
  - es: "Compramos los boletos en la {taquilla}."
    en: "We bought the tickets at the box office."
  - es: "¿Dónde está la {escoba}?"
    en: "Where's the broom?"
    order: true
  - es: "¿Me das una {mordida|mordida} de tu torta?"
    en: "Can I have a bite of your torta?"
  - es: "El policía me pidió una {mordida|mordida#bribe}."
    en: "The police officer asked me for a bribe."
    note: "Informal. La mordida: a bribe. Never offer one."
  - es: "De postre hay {gelatina}."
    en: "There's jello for dessert."
  - es: "Este {melón} está muy dulce."
    en: "This melon is really sweet."
  - es: "Pusimos una foto de mi abuelo en la {ofrenda}."
    en: "We put a photo of my grandpa on the Day of the Dead altar."
  - es: "Quiero dos tacos de {bistec}."
    en: "I'd like two steak tacos."
  - es: "Pon el aceite en el {sartén}."
    en: "Put the oil in the frying pan."
    note: "Mexico usually says el sartén."
    reviewer_notes: "El sartén (Mexico) per the lexicon note; confirm the gender."
  - es: "Los niños juegan futbol en el {recreo}."
    en: "The kids play soccer at recess."
  - es: "El niño tiene {diarrea} desde ayer."
    en: "The boy has had diarrhea since yesterday."
  - es: "Compramos {calaveras} de azúcar para la ofrenda."
    en: "We bought sugar skulls for the altar."
  - es: "Compra la carne en la {carnicería}."
    en: "Buy the meat at the butcher's."
  - es: "Voy a la {panadería} por pan dulce."
    en: "I'm going to the bakery for some pan dulce."
