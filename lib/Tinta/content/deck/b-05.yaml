title: "Deck B: hueso to extranjero"
sentences:
  - es: "Le [di|dar] un {hueso} al perro."
    en: "I gave the dog a bone."
    order: true
  - es: "No tengo {datos} en el celular."
    en: "I'm out of data on my phone."
    note: "Los datos: mobile data. Un dato: a piece of information."
  - es: "Este {puente} nos vamos a la playa."
    en: "This long weekend we're going to the beach."
    note: "Un puente: a long weekend, when a holiday falls next to a weekend."
  - es: "Hay que cruzar el {puente}."
    en: "You have to cross the bridge."
    order: true
  - es: "No hay nada [bueno|bueno] en la {televisión}."
    en: "There's nothing good on television."
  - es: "Estoy viendo una {serie} muy buena."
    en: "I'm watching a really good series."
  - es: "Un agua {natural}, por favor."
    en: "Water at room temperature, please."
    note: "Agua natural: water at room temperature, not from the fridge."
  - es: "El bebé ya está {dormido}."
    en: "The baby's asleep now."
    order: true
  - es: "Hoy estamos a treinta {grados}."
    en: "It's thirty degrees today."
  - es: "¿En qué {grado} vas?"
    en: "What grade are you in?"
    order: true
    reviewer_notes: "Asked of a schoolchild. Is '¿En qué grado vas?' as common as '¿En qué año vas?'"
  - es: "La iglesia es del {siglo} dieciséis."
    en: "The church is from the sixteenth century."
  - es: "El bebé me {sonrió}."
    en: "The baby smiled at me."
    order: true
  - es: "Te mandé un {video} muy chistoso."
    en: "I sent you a really funny video."
  - es: "Es [un poco|un poco] {complicado}."
    en: "It's a bit complicated."
  - es: "Las manzanas están en {oferta}."
    en: "Apples are on sale."
    order: true
  - es: "Hay muchos {peces} en el lago."
    en: "There are lots of fish in the lake."
    note: "A live fish is un pez (plural peces); as food it is pescado."
  - es: "Me encanta la {naturaleza}."
    en: "I love nature."
    order: true
  - es: "Estos zapatos son muy {cómodos}."
    en: "These shoes are really comfortable."
  - es: "Mi prima es una {artista} muy buena."
    en: "My cousin is a really good artist."
  - es: "Tengo muchas {plantas} en mi departamento."
    en: "I have lots of plants in my apartment."
  - es: "Estamos {organizando} una fiesta para mi papá."
    en: "We're organizing a party for my dad."
  - es: "Señor, ¿me {cobra}, por favor?"
    en: "Can I pay, sir?"
    note: "Asking the seller to charge you is the usual way to ask to pay."
  - es: "Me {cobraron} doscientos pesos por el taxi."
    en: "They charged me two hundred pesos for the taxi."
  - es: "Mi abuelo siempre usa {sombrero}."
    en: "My grandpa always wears a hat."
    order: true
  - es: "Mi abuela tiene un {jardín} con muchas flores."
    en: "My grandma has a garden with lots of flowers."
  - es: "¡Ganaste el {premio}!"
    en: "You won the prize!"
  - es: "Me da {vergüenza} hablar en público."
    en: "I'm embarrassed to speak in public."
    note: "Mexico often says me da pena."
  - es: "Me {canso} muy rápido."
    en: "I get tired really quickly."
    order: true
  - es: "¿No te {cansas} de trabajar tanto?"
    en: "Don't you get tired of working so much?"
  - es: "[Manejamos|manejar:pret.1p] cuatro horas por la {carretera}."
    en: "We drove for four hours on the highway."
  - es: "Me gusta más el azul {claro|claro#light}."
    en: "I like the light blue better."
  - es: "¿El carro tiene {seguro|seguro#insurance}?"
    en: "Does the car have insurance?"
  - es: "¿A cuánto está el {dólar}?"
    en: "What's the dollar at?"
    note: "Asking the exchange rate."
  - es: "Estudié mucho; {sin embargo}, no pasé el examen."
    en: "I studied a lot; however, I didn't pass the exam."
  - es: "Pregúntale a un {empleado}."
    en: "Ask an employee."
  - es: "[Abran|abrir:imp.3p] el libro en la {página} veinte."
    en: "Open your books to page twenty."
  - es: "Hay un {pájaro} en la ventana."
    en: "There's a bird at the window."
  - es: "Hoy me toca {barrer} la casa."
    en: "Today it's my turn to sweep the house."
  - es: "El sol se pone en el {oeste}."
    en: "The sun sets in the west."
  - es: "Esta casa está en {venta}."
    en: "This house is for sale."
    order: true
  - es: "Es el mejor {jugador} del equipo."
    en: "He's the best player on the team."
  - es: "¿Ya lo {atienden}?"
    en: "Are you being helped?"
    note: "What a shop assistant asks a customer."
  - es: "El doctor me {atendió} muy rápido."
    en: "The doctor saw me very quickly."
  - es: "El {motor} hace un ruido raro."
    en: "The engine is making a weird noise."
  - es: "Mi casa está a dos {kilómetros} de aquí."
    en: "My house is two kilometers from here."
  - es: "Necesito {pintura} blanca para la pared."
    en: "I need white paint for the wall."
  - es: "¿Me saca una {copia}, por favor?"
    en: "Could you make me a copy, please?"
  - es: "Las {bebidas} están en el refri."
    en: "The drinks are in the fridge."
    order: true
  - es: "Hoy estoy de buen {humor}."
    en: "I'm in a good mood today."
    order: true
  - es: "Vamos al {teatro} el sábado."
    en: "Let's go to the theater on Saturday."
  - es: "[Mañana|mañana] tengo una {entrevista} de [trabajo|trabajo]."
    en: "I have a job interview tomorrow."
  - es: "A las once tomamos el {almuerzo} en la oficina."
    en: "At eleven we have our mid-morning meal at the office."
    note: "In Mexico el almuerzo is a late breakfast; the main meal is la comida."
    reviewer_notes: "'tomamos el almuerzo' vs 'almorzamos': which would an office worker say?"
  - es: "El café es {gratis} para los clientes."
    en: "Coffee is free for customers."
  - es: "Traigo las llaves en el {bolsillo}."
    en: "I've got the keys in my pocket."
  - es: "Hay muchos {extranjeros} en la Condesa."
    en: "There are lots of foreigners in the Condesa."
    note: "En el extranjero: abroad."
