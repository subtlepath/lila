title: Planes y vida social
title_en: Making plans
order: 10
reviewer_notes:
  - "Tú throughout: these are for friends, coworkers your age and people you meet socially."
phrases:
  - es: "¿Qué vas a hacer el sábado?"
    en: "What are you doing on Saturday?"
  - es: "¿Qué planes tienes para el fin de semana?"
    en: "What are your plans for the weekend?"
  - es: "¿Quieres ir por unos tacos?"
    en: "Do you want to go get some tacos?"
    note: "Ir por: to go and get."
  - es: "¿Vamos al cine?"
    en: "Shall we go to the movies?"
  - es: "¿Te parece bien a las ocho?"
    en: "Does eight o'clock work for you?"
  - es: "¿A qué hora nos vemos?"
    en: "What time shall we meet?"
  - es: "Paso por ti a las siete."
    en: "I'll pick you up at seven."
    note: "Pasar por: to pick someone up."
  - es: "Ya voy para allá."
    en: "I'm on my way."
  - es: "Voy a llegar [un poco|un poco] [tarde|tarde#late]."
    en: "I'm going to be a little late."
  - es: "Ya llegué."
    en: "I'm here."
  - es: "¿Te puedo invitar un café?"
    en: "Can I buy you a coffee?"
    note: "Invitar means you pay."
  - es: "Yo invito."
    en: "It's on me."
  - es: "¿[Cada quien|cada quien] paga lo suyo?"
    en: "Shall we each pay for our own?"
    note: "Splitting the check like this is normal among friends."
  - es: "¡Salud!"
    en: "Cheers!"
    note: "Also 'bless you' after a sneeze."
  - es: "¿Quieres bailar?"
    en: "Do you want to dance?"
  - es: "¿Me pasas tu WhatsApp?"
    en: "Can I get your WhatsApp?"
  - es: "¿Llevo algo?"
    en: "Should I bring anything?"
    note: "Taking drinks or dessert to a party is normal."
  - es: "Estás en tu casa."
    en: "Make yourself at home."
    note: "To an usted guest: está en su casa."
  - es: "¡Feliz cumpleaños!"
    en: "Happy birthday!"
  - es: "Gracias por la invitación."
    en: "Thanks for inviting me."
  - es: "Me la pasé muy bien."
    en: "I had a great time."
    note: "Pasársela bien: to have a good time."
  - es: "Ya me voy, se me hizo [tarde|tarde#late]."
    en: "I have to go, it got late."
  - es: "Avísame cuando llegues."
    en: "Text me when you get home."
    note: "Avisar: to let someone know."
