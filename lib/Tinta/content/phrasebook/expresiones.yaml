title: Así se habla
title_en: Mexican expressions
order: 11
reviewer_notes:
  - "Everyday colloquial Mexican. Informal phrases are marked in their notes and carry an informal word, so the pack tags them too. Nothing vulgar: no manches stays, its cruder cousin does not."
phrases:
  - es: "¿Qué onda?"
    en: "What's up?"
    note: "Informal: with friends and people your age."
  - es: "¡Qué milagro!"
    en: "Long time no see!"
    note: "Literally 'what a miracle!', to someone you haven't seen in a while."
  - es: "¡Órale!"
    en: "Wow! / OK, let's go!"
    note: "Informal. Surprise, agreement or encouragement, depending on the tone."
  - es: "¡Ándale!"
    en: "Come on! / That's it!"
    note: "Informal. Ándale pues: OK then."
  - es: "¡[Sale|sale#ok]!"
    en: "OK! / Deal!"
    note: "Informal yes to a plan."
  - es: "¡Híjole!"
    en: "Oh no! / Yikes!"
    note: "Informal. Often before bad news: híjole, ya no hay."
  - es: "¡No manches!"
    en: "No way!"
    note: "Informal: friends only. It's the polite version of a cruder phrase."
  - es: "¡Qué padre!"
    en: "How cool!"
    note: "Informal. Padre here means great, not father."
  - es: "¡Qué chido!"
    en: "Cool!"
    note: "Informal."
  - es: "¡Qué [buena onda|buena onda]!"
    en: "That's so nice of you!"
    note: "Informal. Es muy buena onda: he's a great guy."
  - es: "¡Qué oso!"
    en: "How embarrassing!"
    note: "Informal."
  - es: "Me da pena."
    en: "I'm embarrassed."
    note: "Pena: embarrassment or shyness. Me da pena preguntar: I feel awkward asking."
  - es: "Me cae bien."
    en: "I like him."
    note: "Caer bien: to like a person. Also 'I like her'."
  - es: "La neta, no [sé|saber]."
    en: "Honestly, I don't know."
    note: "Informal. ¿Neta?: for real?"
  - es: "No hay bronca."
    en: "No problem."
    note: "Informal."
  - es: "Ni modo."
    en: "Oh well."
    note: "Nothing to be done about it. Fine with anyone."
  - es: "¡[Aguas|aguas#cuidado]!"
    en: "Watch out!"
    note: "Informal warning, literally 'waters!'. Heads up!"
  - es: "Ahorita vengo."
    en: "I'll be right back."
    note: "Ahorita can mean now, soon or much later; this one means a few minutes."
  - es: "Nos vemos [al rato|al rato]."
    en: "See you in a bit."
    note: "Al rato: later, anything from minutes to hours."
  - es: "Ya merito."
    en: "Almost there."
  - es: "Échale [ganas|ganas]."
    en: "Give it your all!"
    note: "Encouragement before an exam or a hard job. To usted: échele ganas."
  - es: "¿Me echas la mano?"
    en: "Can you give me a hand?"
    note: "Colloquial but fine with anyone. To usted: ¿me echa la mano?"
  - es: "Tengo mucha chamba."
    en: "I've got a lot of work."
    note: "Informal."
  - es: "No traigo lana."
    en: "I don't have any money on me."
    note: "Informal."
  - es: "¿Vamos por unas chelas?"
    en: "Shall we go for some beers?"
    note: "Informal."
  - es: "Estoy crudo."
    en: "I'm hungover."
    note: "Informal. A woman says cruda; la cruda is the hangover."
  - es: "¡Chale!"
    en: "Oh, man!"
    note: "Informal disappointment."
