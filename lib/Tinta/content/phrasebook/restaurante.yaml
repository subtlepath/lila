title: Restaurante, fonda y café
title_en: Restaurant, fonda and café
order: 3
reviewer_notes:
  - "Customer speaks usted to staff throughout. Waiters are called joven or señorita."
phrases:
  - es: "Una mesa para dos, por favor."
    en: "A table for two, please."
  - es: "¿Me trae la carta, por favor?"
    en: "Could you bring me the menu, please?"
    note: "La carta or el menú: both are used."
  - es: "¿Qué me recomienda?"
    en: "What do you recommend?"
  - es: "¿Qué trae la [comida corrida|comida corrida]?"
    en: "What comes with the set lunch?"
    note: "A fonda's fixed-price lunch: soup, rice or pasta, a main dish, agua fresca, sometimes dessert."
  - es: "¿Qué hay de sopa?"
    en: "What's the soup?"
  - es: "¿Qué guisados tiene?"
    en: "What main dishes do you have?"
    note: "Guisados: the stews and main dishes of the day."
  - es: "Para mí, el pollo con mole."
    en: "I'll have the chicken in mole."
  - es: "Soy vegetariano."
    en: "I'm vegetarian."
    note: "A woman says vegetariana."
  - es: "¿Esto tiene carne?"
    en: "Does this have meat in it?"
    note: "Carne often means beef, so ask about pollo and puerco too. Beans may be cooked with lard (manteca)."
  - es: "Soy alérgico a los cacahuates."
    en: "I'm allergic to peanuts."
    note: "A woman says alérgica. Other allergies: a los mariscos (shellfish), a la nuez (nuts)."
  - es: "¿Es agua purificada?"
    en: "Is the water purified?"
    note: "Restaurants use purified water and ice, but it's fine to ask."
  - es: "Sin hielo, por favor."
    en: "No ice, please."
  - es: "¿Me trae otra cerveza?"
    en: "Could you bring me another beer?"
  - es: "[Joven|joven], ¿nos trae más tortillas?"
    en: "Excuse me, could you bring us more tortillas?"
    note: "Joven (young man or woman) is how you call a waiter of almost any age."
  - es: "¿Dónde está el baño?"
    en: "Where's the restroom?"
  - es: "Estuvo muy rico, gracias."
    en: "It was delicious, thanks."
  - es: "¿Qué tiene de postre?"
    en: "What do you have for dessert?"
  - es: "La cuenta, por favor."
    en: "The check, please."
    note: "Waiters won't bring the check until you ask for it."
  - es: "¿Está incluida la propina?"
    en: "Is the tip included?"
    note: "Usually not. Ten to fifteen percent is normal."
  - es: "¿Me trae la terminal?"
    en: "Could you bring the card machine?"
    note: "You pay by card at the table, on a portable terminal."
  - es: "¿Me lo pone para llevar?"
    en: "Could you box this up for me?"
    note: "Taking leftovers home is normal."
  - es: "Un café de olla, por favor."
    en: "A café de olla, please."
    note: "Coffee brewed in a clay pot with cinnamon and piloncillo (raw cane sugar)."
  - es: "¿Tiene leche deslactosada?"
    en: "Do you have lactose-free milk?"
    note: "Lactose-free milk is everywhere in Mexico."
  - es: "¿A qué hora cierran?"
    en: "What time do you close?"
