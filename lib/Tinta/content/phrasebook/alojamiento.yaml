title: Alojamiento
title_en: Hotel and home
order: 8
reviewer_notes:
  - "First half: hotel. Second half: a rented room or apartment and the landlord."
phrases:
  - es: "Tengo una reservación a nombre de Laura Ortega."
    en: "I have a reservation under the name Laura Ortega."
    note: "Put your own name in. Mexico says reservación."
  - es: "¿Cuánto cuesta la noche?"
    en: "How much is it per night?"
  - es: "¿Incluye el desayuno?"
    en: "Is breakfast included?"
  - es: "¿A qué hora es la salida?"
    en: "What time is checkout?"
  - es: "¿Me puede guardar la maleta?"
    en: "Could you keep my suitcase for me?"
    note: "Handy after checkout."
  - es: "¿Me da otra toalla?"
    en: "Could I have another towel?"
  - es: "No hay agua caliente."
    en: "There's no hot water."
  - es: "No sirve el [aire acondicionado|aire acondicionado]."
    en: "The air conditioning doesn't work."
    note: "No sirve (it doesn't work) is how Mexicans say something is broken."
  - es: "Hay mucho ruido."
    en: "It's very noisy."
  - es: "¿Me puede cambiar de cuarto?"
    en: "Could you move me to another room?"
  - es: "Se me olvidó la llave adentro."
    en: "I left my key inside."
    note: "Se me olvidó: the everyday way to say you forgot something."
  - es: "¿Puedo ver el departamento?"
    en: "Can I see the apartment?"
  - es: "¿En cuánto lo renta?"
    en: "How much is the rent?"
    note: "Rentar: to rent, or to rent out. Rents are quoted by the month."
  - es: "¿Está amueblado?"
    en: "Is it furnished?"
  - es: "¿Están incluidos los servicios?"
    en: "Are utilities included?"
    note: "Servicios: water, power, gas and internet."
  - es: "¿Piden depósito?"
    en: "Do you ask for a deposit?"
  - es: "¿Piden aval?"
    en: "Do you need a guarantor?"
    note: "Many landlords want an aval: a guarantor who owns property in the same city."
  - es: "Se [fue|irse] la luz."
    en: "The power went out."
  - es: "Se acabó el gas."
    en: "We've run out of gas."
    note: "Many homes cook and heat water with a gas tank; the gas truck plays a jingle as it passes."
  - es: "La llave del baño gotea."
    en: "The bathroom faucet is dripping."
    note: "Llave is both a key and a faucet."
  - es: "¿Se puede tomar el agua de la llave?"
    en: "Is the tap water safe to drink?"
    note: "In most of Mexico it isn't: drink bottled water or water from a garrafón."
  - es: "¿Dónde compro un garrafón?"
    en: "Where can I buy a big jug of water?"
    note: "A garrafón is a 20-liter jug of purified water; stores deliver and take back the empty one."
  - es: "¿Cuándo pasa el camión de la basura?"
    en: "When does the garbage truck come by?"
    note: "Listen for the bell. Collectors expect a small tip."
