title: Direcciones
title_en: Directions
order: 7
reviewer_notes:
  - "The answers (siga, dé vuelta) use usted commands, as a stranger giving directions would."
phrases:
  - es: "Disculpe, ¿dónde está el metro?"
    en: "Excuse me, where's the metro?"
  - es: "¿Cómo llego a la catedral?"
    en: "How do I get to the cathedral?"
    note: "Swap in any place: al mercado, al Zócalo, a la estación."
  - es: "¿Dónde queda el museo?"
    en: "Where's the museum?"
    note: "Quedar: to be (located)."
  - es: "¿Hay un baño por aquí?"
    en: "Is there a restroom around here?"
  - es: "¿Voy bien para el Zócalo?"
    en: "Am I going the right way for the Zócalo?"
  - es: "¿Está lejos?"
    en: "Is it far?"
  - es: "¿Se puede [ir|ir] caminando?"
    en: "Can you walk there?"
  - es: "Está [como|como] a diez minutos."
    en: "It's about ten minutes away."
    note: "Como before a number: about."
  - es: "Siga derecho dos cuadras."
    en: "Go straight for two blocks."
  - es: "Dé vuelta a la derecha."
    en: "Turn right."
    note: "A la izquierda: left."
  - es: "Está a la vuelta."
    en: "It's just around the corner."
  - es: "Está enfrente del parque."
    en: "It's across from the park."
  - es: "Cruzando la calle."
    en: "Just across the street."
  - es: "Pasando el semáforo, a mano derecha."
    en: "Just past the traffic light, on the right."
  - es: "Al fondo, a la izquierda."
    en: "At the back, on the left."
    note: "Where the restroom usually is."
  - es: "Es para el otro lado."
    en: "It's the other way."
  - es: "Está en el primer piso."
    en: "It's one floor up."
    allow: [piso]
    note: "Floors count from planta baja (the ground floor), so primer piso is the American second floor."
  - es: "Estoy perdido."
    en: "I'm lost."
    note: "A woman says perdida."
  - es: "¿Me lo puede enseñar en el mapa?"
    en: "Could you show me on the map?"
  - es: "¿Me puede escribir la dirección?"
    en: "Could you write down the address?"
