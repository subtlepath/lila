title: Emergencias
title_en: Emergencies and safety
order: 13
phrases:
  - es: "¡Auxilio!"
    en: "Help!"
  - es: "¡Ayúdeme, por favor!"
    en: "Please help me!"
  - es: "¡Llame a una ambulancia!"
    en: "Call an ambulance!"
  - es: "¡Llamen a la policía!"
    en: "Call the police!"
  - es: "¿Cuál es el número de emergencias?"
    en: "What's the emergency number?"
    note: "It's 911 everywhere in Mexico."
  - es: "Hubo un accidente."
    en: "There's been an accident."
  - es: "Hay un herido."
    en: "Someone's hurt."
  - es: "No puede respirar."
    en: "He can't breathe."
    note: "Also 'she can't breathe'."
  - es: "Se cayó y se pegó en la cabeza."
    en: "She fell and hit her head."
    note: "Also 'he fell and hit his head'."
  - es: "¡Cuidado!"
    en: "Watch out!"
  - es: "¡Está temblando!"
    en: "It's an earthquake!"
    note: "In Mexico City the alerta sísmica siren sounds before a strong quake."
  - es: "No corro, no grito, no empujo."
    en: "I don't run, I don't shout, I don't push."
    note: "The earthquake drill motto every Mexican schoolchild knows."
  - es: "Me robaron la cartera."
    en: "My wallet was stolen."
  - es: "Me asaltaron."
    en: "I was mugged."
  - es: "Perdí mi pasaporte."
    en: "I lost my passport."
  - es: "¿Dónde está el Ministerio Público?"
    en: "Where's the public prosecutor's office?"
    note: "In Mexico you report a crime at the Ministerio Público, not at a police station."
  - es: "Quiero levantar una denuncia."
    en: "I want to report a crime."
  - es: "Necesito llamar a mi embajada."
    en: "I need to call my embassy."
  - es: "¿Me presta su teléfono?"
    en: "Could I use your phone?"
    note: "¿Me presta...? (will you lend me) is how you ask to borrow or use something."
  - es: "¿Es [seguro|seguro] caminar por aquí de noche?"
    en: "Is it safe to walk around here at night?"
  - es: "Me están siguiendo."
    en: "Someone is following me."
  - es: "¡Déjeme en paz!"
    en: "Leave me alone!"
  - es: "Voy a llamar a mi [seguro|seguro#insurance]."
    en: "I'm going to call my insurance company."
    note: "After a car crash, call your insurer first: they send an adjuster (ajustador) to the scene."
    reviewer_notes: "Is 'call your insurer first and wait for the ajustador' the right advice to give?"
