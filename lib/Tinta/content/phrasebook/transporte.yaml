title: Transporte
title_en: Getting around
order: 6
reviewer_notes:
  - "Metro details are for Mexico City (card, women's cars, line numbers). Pesero, taxi and bus phrases are meant to work anywhere in Mexico."
phrases:
  - es: "¿Dónde compro la tarjeta del metro?"
    en: "Where do I buy a metro card?"
    note: "In Mexico City one rechargeable card works on the metro, the Metrobús and light rail."
  - es: "¿Qué línea va a Bellas Artes?"
    en: "Which line goes to Bellas Artes?"
    note: "Swap in any station."
  - es: "¿Dónde transbordo para la línea tres?"
    en: "Where do I change for Line 3?"
  - es: "¿En qué estación me bajo para el Zócalo?"
    en: "Which station do I get off at for the Zócalo?"
  - es: "Los primeros vagones son para mujeres y niños."
    en: "The front cars are for women and children."
    note: "On the Mexico City metro and Metrobús, look for the signs on the platform."
  - es: "¿Este va al centro?"
    en: "Does this one go downtown?"
  - es: "¿Pasa por el metro Insurgentes?"
    en: "Does it go past Insurgentes metro station?"
    note: "Peseros list their main stops on the windshield; ask the driver."
  - es: "¿Este camión me deja en el mercado?"
    en: "Will this bus drop me at the market?"
  - es: "¿Cuánto es el pasaje?"
    en: "How much is the fare?"
  - es: "¿Me hace el favor de pasarlo?"
    en: "Could you pass this up, please?"
    note: "In a full pesero, passengers pass your fare to the driver and your change back."
  - es: "¡Bajan!"
    en: "Getting off!"
    note: "Call it out so the pesero driver stops for you."
  - es: "En la esquina, por favor."
    en: "At the corner, please."
  - es: "¿Me pide un taxi de sitio?"
    en: "Could you call me a taxi?"
    note: "Hotels and restaurants will call a taxi de sitio, from a stand: safer than hailing one."
  - es: "¿Cuánto me cobra al aeropuerto?"
    en: "How much to the airport?"
    note: "Agree on the fare before you get in, unless the taxi has a meter."
  - es: "Lléveme a esta dirección, por favor."
    en: "Take me to this address, please."
  - es: "Aquí está bien, gracias."
    en: "Here is fine, thanks."
  - es: "¿Viene por Tom?"
    en: "Are you here for Tom?"
    note: "Use your own name. With a ride app, check the driver's name and plates before you get in."
  - es: "¿Me abre la cajuela?"
    en: "Could you open the trunk?"
  - es: "Un boleto para Puebla, por favor."
    en: "One ticket to Puebla, please."
    note: "Swap in your destination. Boleto, not billete: a billete is a banknote."
  - es: "¿A qué hora sale el próximo autobús?"
    en: "What time does the next bus leave?"
    note: "Autobús is a long-distance coach; a city bus is a camión."
  - es: "¿De qué terminal sale?"
    en: "Which terminal does it leave from?"
    note: "Mexico City has four bus terminals: Norte, Sur, Oriente (TAPO) and Poniente."
  - es: "¿Es directo?"
    en: "Is it nonstop?"
  - es: "¿Cuántas horas se hace a Oaxaca?"
    en: "How many hours does it take to Oaxaca?"
    note: "Hacer gives travel time: se hace una hora, it takes an hour."
  - es: "¿Me da ventanilla?"
    en: "Can I have a window seat?"
    note: "An aisle seat is pasillo."
  - es: "¿Dónde documento la maleta?"
    en: "Where do I check my bag?"
    note: "Documentar: to check in luggage."
  - es: "¿De qué sala sale el vuelo?"
    en: "Which gate does the flight leave from?"
    note: "Mexican airports call departure gates salas."
    reviewer_notes: "Sala or puerta for an airport gate? Mexico City's airport signs say sala; I am less sure about other airports."
  - es: "Se retrasó el vuelo."
    en: "The flight is delayed."
  - es: "¿Dónde están los taxis autorizados?"
    en: "Where are the authorized taxis?"
    note: "At airports and bus terminals, buy a prepaid ticket at the official taxi booth."
