title: El mercado y el tianguis
title_en: Market and tianguis
order: 4
reviewer_notes:
  - "Several phrases are what the vendor says (marked in the notes), so the learner can understand them."
phrases:
  - es: "¿Hay tianguis hoy?"
    en: "Is there a street market today?"
    note: "Each neighborhood's tianguis sets up on fixed days of the week."
  - es: "Pásele, marchanta, ¿qué le damos?"
    en: "Come on over, what can I get you?"
    note: "The vendor's call. Customers are marchante or marchanta, güero, joven: it's friendly."
  - es: "¿Qué va a llevar?"
    en: "What would you like?"
    note: "The vendor's question."
  - es: "¿A cómo está el kilo de jitomate?"
    en: "How much is a kilo of tomatoes?"
    note: "¿A cómo...? asks the going price, especially by weight."
  - es: "¿Cuánto cuestan?"
    en: "How much are they?"
  - es: "Están a veinte el kilo."
    en: "They're twenty pesos a kilo."
    note: "The vendor's answer."
  - es: "¿Me da un kilo de limones?"
    en: "Can I have a kilo of limes?"
    note: "Swap in anything: un kilo de naranjas, medio kilo de jitomate."
  - es: "¿Me da medio kilo de tortillas?"
    en: "Can I have half a kilo of tortillas?"
    note: "Tortillerías sell by weight; a kilo is about thirty-five tortillas."
  - es: "¿Me da un cuarto de queso?"
    en: "Can I have a quarter kilo of cheese?"
    note: "Un cuarto is 250 grams."
  - es: "¿Me da diez pesos de cilantro?"
    en: "Can I have ten pesos' worth of cilantro?"
    note: "Herbs, chiles and limes are often sold by the peso, not by weight."
  - es: "¿Para hoy o para [mañana|mañana]?"
    en: "For today or for tomorrow?"
    note: "An avocado seller asks when you'll eat them, to pick the ripeness."
  - es: "¿Están maduros?"
    en: "Are they ripe?"
  - es: "¿Son de temporada?"
    en: "Are they in season?"
  - es: "¿Me da a [probar|probar]?"
    en: "Can I try some?"
    note: "Vendors often let you taste fruit, cheese or mole."
  - es: "Me llevo estos."
    en: "I'll take these."
  - es: "¿Me lo deja más barato?"
    en: "Could you make it a little cheaper?"
    note: "Bargain gently, at crafts stalls and for a big order, not over a few pesos of food."
    reviewer_notes: "Is this the right advice on bargaining in markets and tianguis?"
  - es: "Ya no hay."
    en: "There's none left."
  - es: "¿Algo más? —Es todo, gracias."
    en: "Anything else? —That's all, thanks."
  - es: "¿Cuánto es de todo?"
    en: "How much is it altogether?"
  - es: "Traigo mi bolsa."
    en: "I've brought my own bag."
    note: "Mexico City banned free plastic bags, so take one to the market."
  - es: "¿Dónde está el puesto de jugos?"
    en: "Where's the juice stand?"
  - es: "Un licuado de plátano, por favor."
    en: "A banana smoothie, please."
    note: "A licuado is blended with milk; a jugo is plain juice."
