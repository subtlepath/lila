title: Teléfono y trámites
title_en: Phone, internet and errands
order: 9
phrases:
  - es: "¿[Bueno|bueno#hello]?"
    en: "Hello?"
    note: "How Mexicans answer the phone."
  - es: "¿Quién habla?"
    en: "Who's calling?"
  - es: "¿Me comunica con recepción?"
    en: "Could you put me through to reception?"
  - es: "Ahorita le marco."
    en: "I'll call you right back."
    note: "Marcar (to dial) means 'to call'. Ahorita can mean now or later; here, soon."
  - es: "Le hablo más [tarde|tarde#late]."
    en: "I'll call you later."
    note: "Hablar also means 'to call' in Mexico."
  - es: "Se cayó la llamada."
    en: "The call dropped."
  - es: "No tengo señal."
    en: "I don't have a signal."
  - es: "¿Dónde puedo comprar un chip?"
    en: "Where can I buy a SIM card?"
    note: "A SIM card is a chip."
  - es: "Quiero hacer una recarga de cien pesos."
    en: "I'd like a hundred-peso top-up."
    note: "Prepaid phone credit is sold at OXXO and corner shops."
  - es: "Se me [acabaron|acabarse] los datos."
    en: "I ran out of data."
  - es: "Se me descargó el celular."
    en: "My phone died."
  - es: "¿Me presta su cargador?"
    en: "Could I borrow your charger?"
  - es: "¿Me da la clave del wifi?"
    en: "Could I have the wifi password?"
  - es: "¿Me manda la ubicación por WhatsApp?"
    en: "Could you send me the location on WhatsApp?"
    note: "Shops, doctors and landlords all use WhatsApp."
  - es: "¿Dónde hay un OXXO?"
    en: "Where's an OXXO?"
    note: "These corner stores take bill payments, phone top-ups and cash deposits."
  - es: "¿Dónde pago el recibo de la luz?"
    en: "Where do I pay the electric bill?"
    note: "At OXXO, a bank or online. Recibo: a bill."
  - es: "¿Dónde hay una lavandería?"
    en: "Where's a laundromat?"
    note: "Most lavanderías wash, dry and fold for you, by the kilo."
  - es: "¿Para cuándo está lista?"
    en: "When will it be ready?"
    note: "Lista agrees with la ropa (the laundry); for a thing like el paquete, listo."
  - es: "¿Dónde puedo sacar copias?"
    en: "Where can I make copies?"
    note: "At a papelería (stationery store), which also prints and scans."
  - es: "Quiero mandar un paquete a Estados Unidos."
    en: "I want to send a package to the United States."
  - es: "¿Dónde está el correo?"
    en: "Where's the post office?"
