title: Salud y farmacia
title_en: Health and pharmacy
order: 12
phrases:
  - es: "Me siento [mal|mal]."
    en: "I don't feel well."
  - es: "Me duele la cabeza."
    en: "I have a headache."
    note: "Swap in the place: me duele el estómago, la garganta, la espalda."
  - es: "Me duele aquí."
    en: "It hurts here."
  - es: "Tengo fiebre."
    en: "I have a fever."
  - es: "Tengo gripa."
    en: "I have a cold."
    note: "Gripa: the Mexican word for a cold or the flu."
  - es: "Tengo diarrea."
    en: "I have diarrhea."
  - es: "Creo que algo me cayó [mal|mal]."
    en: "I think something didn't agree with me."
    note: "Caer mal: for food that disagrees with you."
  - es: "Estoy mareado."
    en: "I feel dizzy."
    note: "A woman says mareada."
  - es: "Me quemé con el sol."
    en: "I got sunburned."
  - es: "Me picó un mosco."
    en: "A mosquito bit me."
  - es: "Me duele una muela."
    en: "I have a toothache."
  - es: "¿Tiene algo para la tos?"
    en: "Do you have something for a cough?"
  - es: "¿Tiene repelente de moscos?"
    en: "Do you have mosquito repellent?"
  - es: "¿Hay alguna farmacia abierta?"
    en: "Is there a pharmacy open?"
  - es: "¿Tienen consultorio?"
    en: "Is there a doctor here?"
    note: "Many pharmacies have a doctor's office next door with cheap consultations."
  - es: "¿Cuánto cuesta la consulta?"
    en: "How much is the consultation?"
  - es: "¿Puedo hacer una cita?"
    en: "Can I make an appointment?"
  - es: "¿Necesito receta?"
    en: "Do I need a prescription?"
    note: "Antibiotics need one; many other medicines don't."
  - es: "¿Tiene el genérico?"
    en: "Do you have the generic?"
  - es: "¿Cada cuánto me la tomo?"
    en: "How often do I take it?"
  - es: "Una cada ocho horas."
    en: "One every eight hours."
  - es: "Soy alérgico a la penicilina."
    en: "I'm allergic to penicillin."
    note: "A woman says alérgica."
  - es: "Soy diabético."
    en: "I'm diabetic."
    note: "A woman says diabética."
  - es: "Estoy embarazada."
    en: "I'm pregnant."
    note: "Not 'embarrassed'! For that, say me da pena."
