title: Compras y dinero
title_en: Shopping and money
order: 5
phrases:
  - es: "[Nada más|nada más] estoy viendo, gracias."
    en: "I'm just looking, thanks."
  - es: "¿Cuánto cuesta?"
    en: "How much does it cost?"
  - es: "¿A qué hora abren?"
    en: "What time do you open?"
  - es: "¿Tiene una talla más grande?"
    en: "Do you have a bigger size?"
  - es: "¿Lo tiene en otro color?"
    en: "Do you have it in another color?"
  - es: "¿Me lo puedo probar?"
    en: "Can I try it on?"
  - es: "Me queda chico."
    en: "It's too small for me."
    note: "Quedar: to fit. Me queda grande: it's too big."
  - es: "Me lo llevo."
    en: "I'll take it."
  - es: "¿Me cobra, por favor?"
    en: "Can I pay, please?"
    note: "Literally 'will you charge me?': how you ask to pay at a counter."
  - es: "¿Con tarjeta o en efectivo?"
    en: "Card or cash?"
    note: "The cashier's question."
  - es: "¿Aceptan tarjeta?"
    en: "Do you take cards?"
  - es: "[Nada más|nada más] efectivo."
    en: "Cash only."
    note: "Markets, street stands and small shops often take only cash."
  - es: "¿Cobran comisión?"
    en: "Do you charge a fee?"
    note: "Some shops add a fee for card payments."
  - es: "No pasó la tarjeta."
    en: "The card didn't go through."
  - es: "¿Le puedo pagar con transferencia?"
    en: "Can I pay you by bank transfer?"
    note: "Paying by transfer from your phone is common, even at small businesses."
  - es: "¿Tiene [cambio|cambio] de quinientos?"
    en: "Do you have change for five hundred?"
    note: "Small shops often can't break a big bill; carry coins and small bills."
  - es: "No traigo [cambio|cambio]."
    en: "I don't have any change on me."
    note: "Traer: to have on you."
  - es: "¿Gusta redondear?"
    en: "Would you like to round up?"
    note: "Cashiers ask if you'll round up the total for charity. No, gracias is fine."
  - es: "¿Me da el ticket, por favor?"
    en: "Could I have the receipt, please?"
    note: "The ticket is the till receipt; a factura is a formal tax invoice."
  - es: "Me cobró de más."
    en: "You charged me too much."
  - es: "¿Dónde hay un cajero?"
    en: "Where's an ATM?"
    note: "Use ATMs inside banks and stores, in daylight."
  - es: "El cajero se tragó mi tarjeta."
    en: "The ATM swallowed my card."
  - es: "¿Dónde puedo cambiar dólares?"
    en: "Where can I change dollars?"
    note: "A casa de cambio usually gives a better rate than a hotel."
  - es: "¿A cómo está el dólar?"
    en: "What's the dollar rate today?"
