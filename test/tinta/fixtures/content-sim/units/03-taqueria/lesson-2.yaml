number: 2
title: Me encanta el picante
title_en: I love spicy food
level: A1
reviewer_notes:
  - "Culture note: Nahuatl spoken by over a million people; aguacate from ahuacatl, jitomate from xitomatl, chile from chilli. Correct?"
  - "Usage note: pica poquito usually means quite a lot; either salsa can be the hot one. Fair?"
new: [gustar, encantar, bueno, rico, dulce, picante, picar, salsa, cebolla, cilantro, aguacate, jitomate]
conjugate: ["gustar:pres.3s", "gustar:pres.3p", "encantar:pres.3s"]
notes:
  - kind: grammar
    title: "Gustar: what pleases you"
    text: |
      Spanish says "it pleases me" instead of "I like". The thing you like is the subject, so the verb agrees with it:

      - _Me gusta el aguacate._ — I like avocado. (one thing)
      - _Me gustan los tacos._ — I like tacos. (several)

      The small word in front says who likes it: _me_ (me), _te_ (you), _le_ (him, her, you formal), _nos_ (us), _les_ (them, you all). For emphasis or contrast add _a mí_, _a ti_, _a él_, _a Sofía_: _A mí me gusta, pero a Tom no._

      There is no "yo gusto" for "I like". _Encantar_ (to love a thing) works the same way and is stronger: _Me encanta el picante._
  - kind: usage
    title: Spicy and tasty
    text: |
      - _picar_ — to be spicy: _¿Pica?_ (Is it spicy?) If the answer is _pica poquito_ (just a little), be careful: it usually means quite a lot.
      - _picante_ — spicy: _La salsa verde es muy picante._
      - _rico_ — delicious, said with _estar_: _¡Está muy rico!_ With _ser_, _rico_ means rich.

      Most taco stands set out a _salsa verde_ and a _salsa roja_. Either can be the hot one, so ask before you pour.
  - kind: culture
    title: Food words from Nahuatl
    text: |
      Many Mexican food words come from Nahuatl, the language of the Aztecs, still spoken by over a million people:

      - _aguacate_ from _ahuacatl_ — avocado
      - _jitomate_ from _xitomatl_ — red tomato
      - _chile_ from _chilli_ — chili pepper

      In central Mexico _tomate_ is the small green tomatillo of salsa verde, so a red tomato is a _jitomate_. Ask for _jitomate_ at the market.
