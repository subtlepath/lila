dialogue:
  title: "¿Pica?"
  title_en: Is it spicy?
  lines:
    - speaker: Tom
      es: "Disculpe, ¿la salsa verde pica?"
      en: "Excuse me, is the green salsa spicy?"
    - speaker: Chuy
      es: "Sí, pica mucho. La roja pica [un poco|un poco]."
      en: "Yes, it's very hot. The red one is a little spicy."
    - speaker: Sofía
      es: "¡A mí me encanta el picante! ¿Y a ti, Tom?"
      en: "I love spicy food! What about you, Tom?"
    - speaker: Tom
      es: "A mí no. Me gusta mucho el aguacate, pero no me gusta la cebolla."
      en: "Not me. I really like the avocado, but I don't like onion."
    - speaker: Sofía
      es: "¡A mí tampoco!"
      en: "Me neither!"
    - speaker: Chuy
      es: "¿Quiere más cilantro?"
      en: "Would you like more cilantro?"
    - speaker: Tom
      es: "Sí, gracias. ¡Está muy rico!"
      en: "Yes, thanks. It's delicious!"
