number: 4
title: "¿Cuánto es?"
title_en: How much is it?
level: A1
reviewer_notes:
  - "Prices: taco 15 pesos, torta 40-45, order of tacos 50, two beers 70, a soda at 80 as too expensive, total 180 for 5 tacos, 2 quesadillas and 2 sodas at a street stand. Realistic for 2026?"
  - "Culture note: tip 10 to 15 percent in restaurants, rarely on the check; a few coins for the taquero are welcome; many small places are cash only; $ is used for pesos. Accurate?"
  - "¿Cuánto le doy? translated 'What do I owe you?': right?"
new: [cuarenta, cincuenta, sesenta, setenta, ochenta, noventa, cien, peso, costar, pagar, tarjeta, propina]
conjugate: ["costar:pres.3s", "costar:pres.3p", "pagar:pres"]
notes:
  - kind: grammar
    title: Numbers 31-100
    text: |
      From 31 to 99, say the tens, then _y_ (and), then the units: _treinta y uno_, _cuarenta y cinco_, _noventa y nueve_. The _y_ goes only between the tens and the units.

      - _cuarenta_ — 40
      - _cincuenta_ — 50
      - _sesenta_ — 60
      - _setenta_ — 70
      - _ochenta_ — 80
      - _noventa_ — 90
      - _cien_ — 100

      _Cien_ is exactly 100: _cien pesos_. From 101 the word is _ciento_: _ciento veinte_ (120). Do not mix up _sesenta_ (60, with _s_) and _setenta_ (70, with _t_).
  - kind: usage
    title: Prices
    text: |
      - _¿Cuánto cuesta?_ — How much is it? (one thing)
      - _¿Cuánto cuestan?_ — How much are they? (several)
      - _¿Cuánto es?_ — How much is it all? (the total)
      - _Son ochenta pesos._ — That's eighty pesos.

      _Costar_ changes _o_ to _ue_ and agrees with the thing: _la torta cuesta_, _los tacos cuestan_.

      Mexico writes prices with the $ sign, the same sign as the dollar: $80 on a menu is eighty pesos.
  - kind: culture
    title: Paying and tipping
    text: |
      In a restaurant, leave a _propina_ of 10 to 15 percent; it is rarely on the check. At a taco stand you say what you ate and pay at the end, and a few coins for the taquero are welcome.

      Many small places take cash only, so ask first: _¿Aceptan tarjeta?_ (Do you take cards?) To pay, say _¿Cuánto le doy?_ (What do I owe you?) or _¿Puedo pagar con tarjeta?_
