dialogue:
  title: "¿Cuánto le doy?"
  title_en: What do I owe you?
  lines:
    - speaker: Sofía
      es: "Chuy, ¿cuánto le doy?"
      en: "Chuy, what do I owe you?"
    - speaker: Chuy
      es: "¿Cuántos tacos son?"
      en: "How many tacos did you have?"
    - speaker: Sofía
      es: "Cinco tacos [al pastor|al pastor], dos quesadillas y dos refrescos."
      en: "Five tacos al pastor, two quesadillas and two sodas."
    - speaker: Chuy
      es: "Son ciento ochenta pesos."
      en: "That's a hundred and eighty pesos."
    - speaker: Tom
      es: "¿Puedo pagar con tarjeta?"
      en: "Can I pay by card?"
    - speaker: Chuy
      es: "No, perdón, no aceptamos tarjeta."
      en: "No, sorry, we don't take cards."
    - speaker: Sofía
      es: "Yo pago, Tom. Aquí están los ciento ochenta, Chuy."
      en: "I'll pay, Tom. Here's the hundred and eighty, Chuy."
    - speaker: Tom
      es: "Gracias, Sofía. Y yo pago la propina."
      en: "Thanks, Sofía. And I'll get the tip."
