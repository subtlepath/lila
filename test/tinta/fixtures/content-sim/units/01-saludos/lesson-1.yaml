number: 1
title: ¡Hola! ¿Qué tal?
title_en: Hello! How's it going?
level: A1
new: [hola, buenos días, buenas tardes, buenas noches, qué tal, bien, gracias, mucho gusto, igualmente, adiós, hasta luego, qué onda]
notes:
  - kind: usage
    title: Greetings through the day
    text: |
      Mexicans greet by the clock:

      - _buenos días_ from waking up until about noon
      - _buenas tardes_ from noon until dark
      - _buenas noches_ after dark, both to say hello and to say goodbye

      _Hola_ works at any hour and often comes first: _Hola, buenas tardes._ Among friends you will also hear a short _¡Buenas!_ at any time of day.

      Say a greeting when you walk into a shop, a waiting room, an elevator or a taxi. Skipping it can come across as cold.
  - kind: culture
    title: Meeting people
    text: |
      When you meet someone, say _mucho gusto_ (nice to meet you). The answer is _igualmente_ (likewise) or _mucho gusto_ again.

      Men usually shake hands. Women, and a man and a woman who know each other, usually touch right cheeks with a light kiss.

      Before any business, at a counter, an office or a market stall, ask how the other person is: _Buenos días, ¿cómo está?_ It is the polite way in.
  - kind: usage
    title: Formal, neutral and informal
    text: |
      Tinta tags every word with a register. Most words are neutral. _¿Qué onda?_ (what's up?) is *informal*: use it with friends and people your age, not with your boss or a police officer. _¿Qué tal?_ is neutral and fits almost anywhere.

      - with anyone: _Hola, ¿qué tal?_
      - with a stranger or an older person: _Buenos días, ¿cómo está?_
      - with a friend: _¿Qué onda? ¿Cómo estás?_
