dialogue:
  title: En el edificio
  title_en: In the building
  lines:
    - speaker: Laura
      es: "Buenos días."
      en: "Good morning."
    - speaker: Diego
      es: "Buenos días, señora. Diego Ortega, mucho gusto."
      en: "Good morning, ma'am. I'm Diego Ortega, nice to meet you."
    - speaker: Laura
      es: "¡Ah! Igualmente, Diego. ¡Bienvenido!"
      en: "Oh! Likewise, Diego. Welcome!"
    - speaker: Diego
      es: "Gracias. ¿[Qué tal|qué tal] todo por aquí?"
      en: "Thank you. How's everything around here?"
    - speaker: Laura
      es: "Muy bien, gracias. ¡Hasta luego!"
      en: "Very good, thanks. See you later!"
    - speaker: Diego
      es: "¡Hasta luego, señora!"
      en: "See you, ma'am!"
