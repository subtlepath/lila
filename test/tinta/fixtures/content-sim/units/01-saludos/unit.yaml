number: 1
title: Saludos y cortesía
title_en: Greetings and courtesy
goals:
  - Greet people and say goodbye at any time of day.
  - Introduce yourself and say where you are from with ser.
  - Use the subject pronouns, and choose between tú and usted.
  - Be polite the Mexican way with con permiso, ¿mande?, provecho and ahorita.
