title: En la taquería
title_en: At the taco stand
order: 2
reviewer_notes:
  - "Fillings: I used bistec and suadero as the examples because they are on every Mexico City stand. Swap in fillings that travel better if you prefer."
phrases:
  - es: "¿De qué hay?"
    en: "What kinds do you have?"
    note: "Ask this at any stand to hear the fillings."
  - es: "¿Me da tres tacos [al pastor|al pastor], por favor?"
    en: "Can I have three tacos al pastor, please?"
    note: "¿Me da...? is the everyday way to order."
  - es: "Dos de bistec y uno de suadero, por favor."
    en: "Two steak and one suadero, please."
    note: "Order by filling: dos de pastor, uno de bistec. Suadero is a soft, juicy beef cut."
  - es: "Con todo, por favor."
    en: "With everything, please."
    note: "Everything means chopped onion and cilantro."
  - es: "Sin cebolla, por favor."
    en: "No onion, please."
  - es: "¿Para aquí o para llevar?"
    en: "For here or to go?"
    note: "What the taquero asks. For here usually means standing at the stand."
  - es: "Para llevar, por favor."
    en: "To go, please."
  - es: "¿Con o sin queso?"
    en: "With or without cheese?"
    note: "In Mexico City a quesadilla comes without cheese unless you ask, so they check."
    reviewer_notes: "Is the quesadilla-without-cheese note fair to say for Mexico City in general?"
  - es: "¿Pica mucho?"
    en: "Is it very spicy?"
  - es: "¿Cuál pica más?"
    en: "Which one is hotter?"
    note: "Ask before you pour: green or red, either one can be fiery."
  - es: "¿Me pasa la salsa verde?"
    en: "Could you pass me the green salsa?"
  - es: "Una torta de milanesa, por favor."
    en: "A breaded steak torta, please."
  - es: "Un agua de jamaica, por favor."
    en: "A hibiscus agua fresca, please."
    note: "Aguas frescas: jamaica, horchata, tamarindo. Agua is feminine but takes un."
  - es: "¿Me da otro, por favor?"
    en: "Can I have another one, please?"
  - es: "¿Cuánto le debo?"
    en: "How much do I owe you?"
    note: "At a stand you pay when you finish, and tell them what you had."
  - es: "[Fueron|ser] cuatro tacos y un refresco."
    en: "I had four tacos and a soda."
    note: "Literally 'it was...': how you tell the taquero what to charge."
  - es: "¿Cuánto es?"
    en: "How much is it?"
  - es: "¡Provecho!"
    en: "Enjoy your meal!"
    note: "Say it to people eating as you pass or leave."
