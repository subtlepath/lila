title: Saludos y cortesía
title_en: Greetings and courtesy
order: 1
reviewer_notes:
  - "Usted throughout, since these are for strangers, staff and elders. The tú versions are in the notes."
phrases:
  - es: "Buenos días."
    en: "Good morning."
    note: "Until about noon. Then buenas tardes, and after dark buenas noches."
  - es: "Buenas tardes."
    en: "Good afternoon."
    note: "Also said to the room when you walk into a shop, a waiting room or an elevator."
  - es: "Buenas noches."
    en: "Good evening."
    note: "After dark, both to say hello and to say good night."
  - es: "¿Cómo está usted?"
    en: "How are you?"
    note: "Formal. To a friend: ¿Cómo estás?"
  - es: "Muy bien, gracias. ¿Y usted?"
    en: "Very well, thanks. And you?"
  - es: "¿Qué tal?"
    en: "How's it going?"
    note: "Friendly but fine with anyone."
  - es: "¿Cómo se llama?"
    en: "What's your name?"
    note: "Formal. To a friend or a child: ¿Cómo te llamas?"
  - es: "Me llamo Tom, mucho gusto."
    en: "My name is Tom. Nice to meet you."
    note: "Put your own name in."
  - es: "Mucho gusto."
    en: "Nice to meet you."
  - es: "Encantado."
    en: "Pleased to meet you."
    note: "A woman says encantada."
  - es: "¿De dónde es?"
    en: "Where are you from?"
    note: "Formal. To a friend: ¿De dónde eres?"
  - es: "Soy de Estados Unidos."
    en: "I'm from the United States."
    note: "Or soy de Canadá, soy de Chicago."
  - es: "¿A qué se dedica?"
    en: "What do you do for a living?"
    note: "Formal. To a friend: ¿A qué te dedicas?"
  - es: "Tengo dos meses en México."
    en: "I've been in Mexico for two months."
    note: "Mexicans use tener for how long you've been somewhere."
  - es: "Hace mucho calor, ¿verdad?"
    en: "It's really hot, isn't it?"
    note: "¿Verdad? at the end asks for agreement, like 'isn't it?'"
  - es: "Disculpe, ¿habla inglés?"
    en: "Excuse me, do you speak English?"
  - es: "Hablo [un poco|un poco] de español."
    en: "I speak a little Spanish."
  - es: "No entiendo."
    en: "I don't understand."
  - es: "¿[Mande|mande]?"
    en: "Pardon?"
    note: "The polite Mexican way to ask someone to repeat."
  - es: "Más despacio, por favor."
    en: "More slowly, please."
  - es: "¿Me lo puede repetir, por favor?"
    en: "Could you say that again, please?"
  - es: "¿Cómo se dice esto en español?"
    en: "How do you say this in Spanish?"
    note: "Point at the thing as you ask."
  - es: "¿Qué quiere decir eso?"
    en: "What does that mean?"
  - es: "Con permiso."
    en: "Excuse me."
    note: "To get past someone, or when you leave a room or a table."
  - es: "¡Perdón!"
    en: "Sorry!"
    note: "When you bump into someone. To get someone's attention, say disculpe."
  - es: "Muy amable."
    en: "That's very kind of you."
    note: "A warm thank-you for a favor or directions."
  - es: "A sus órdenes."
    en: "At your service."
    note: "What staff and shopkeepers say; also a polite reply to thanks."
  - es: "Pásele."
    en: "Come in. / Go ahead."
    note: "Shopkeepers say it to invite you in; hosts, to let you through the door first."
  - es: "Ahorita no, gracias."
    en: "Not right now, thanks."
    note: "A polite no to a street vendor."
  - es: "Que le vaya bien."
    en: "Take care."
    note: "A warm goodbye, literally 'may it go well for you'. To a friend: que te vaya bien."
