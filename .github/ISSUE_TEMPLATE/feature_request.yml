name: Feature Request
description: Propose a change to lila
title: "Short, descriptive title of the request"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to propose a change to lila!

        lila is opinionated on purpose: it trades settings for designed defaults. Please read
        [What makes lila opinionated](https://github.com/subtlepath/lila#what-makes-lila-opinionated) first.
        General features that don't depend on those opinions belong upstream in
        [CrossPoint](https://github.com/crosspoint-reader/crosspoint-reader), where every fork benefits.

        If you are not sure whether your idea fits, open a [Discussion](../../discussions) first.

  - type: checkboxes
    id: fit-check
    attributes:
      label: Fit check (required)
      options:
        - label: I have read "What makes lila opinionated" in the README.
          required: true
        - label: This is about lila's reading experience, not a general CrossPoint feature.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What user-facing problem or reading-experience gap does this address? Be concrete.
      placeholder: e.g., "When reading in landscape, paragraph breaks are inconsistent because..."
    validations:
      required: true

  - type: textarea
    id: stock-gap
    attributes:
      label: Why lila does not already solve this
      description: What did you try in lila (and CrossPoint) and why does it fall short?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: A short description of what you would build or change. Focus on user impact; implementation details can come later.
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: Memory / flash / complexity cost
      description: |
        lila runs on 380KB of RAM. Roughly how much DRAM, flash, or code complexity does this add?
        "Don't know" is a valid answer, but please attempt an estimate.
      placeholder: e.g., "Adds ~2KB flash for the new font tables, no DRAM impact at runtime."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else relevant (links, screenshots, related discussions).
    validations:
      required: false
